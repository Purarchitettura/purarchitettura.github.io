<style>
/* Stile purarchitettura.it: fondo bianco, Arial, titoli maiuscoli spaziati, accento oro, pulsanti a pillola */
:root{--bg:#fff;--surface:#fff;--soft:#f6f4ef;--ink:#333;--muted:#7a7a7a;--faint:#a9a9a9;--line:#e4e1da;--gold:#84754e;--gold-ink:#fff;--gold-soft:#f1ede3;--danger:#a33a2c;--ok:#4d6b3c;--warn-bg:#f7f1e1;--warn-ink:#6b5a2e;--f:Arial,"Helvetica Neue",Helvetica,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161513;--surface:#1e1d1a;--soft:#24221e;--ink:#e8e5de;--muted:#a8a399;--faint:#7d786e;--line:#34312b;--gold:#b8a676;--gold-ink:#161513;--gold-soft:#2b2820;--danger:#e08a7d;--ok:#a6c48f;--warn-bg:#2b2820;--warn-ink:#e3d3a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161513;--surface:#1e1d1a;--soft:#24221e;--ink:#e8e5de;--muted:#a8a399;--faint:#7d786e;--line:#34312b;--gold:#b8a676;--gold-ink:#161513;--gold-soft:#2b2820;--danger:#e08a7d;--ok:#a6c48f;--warn-bg:#2b2820;--warn-ink:#e3d3a6;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f);-webkit-text-size-adjust:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
[hidden],.hidden{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

header.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:12px;min-height:62px;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0;flex:1 1 auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark{width:34px;height:32px;flex:none}
.word{display:grid;line-height:1.15;min-width:0}
.word b{font-weight:400;font-size:18px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word b span{color:var(--gold)}
.word small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border:1px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.gold{border-color:var(--gold);color:var(--gold)}.btn.gold:hover{background:var(--gold);color:var(--gold-ink)}
.btn.solid{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}.btn.solid:hover{filter:brightness(.93)}
.btn.quiet{border-color:var(--line);color:var(--muted)}.btn.quiet:hover{background:var(--soft);color:var(--ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)}.btn.danger:hover{background:var(--danger);color:#fff}
.btn.small{min-height:32px;padding:0 13px;font-size:10.5px}
.btn.icon{padding:0;width:34px;min-height:34px}

.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0}
h1.title{font-weight:400;font-size:clamp(24px,5vw,34px);letter-spacing:.16em;text-transform:uppercase;margin:6px 0 0;line-height:1.2}
.rule{width:64px;height:1px;background:var(--gold);border:0;margin:16px 0 0}
.lead{color:var(--muted);max-width:64ch;margin:12px 0 0;font-size:15px}
.hero{padding-block:30px 8px}

/* elenco perizie */
.list{display:grid;gap:12px;margin-top:24px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;border:1px solid var(--line);background:var(--surface);padding:16px 18px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--gold)}
.item b{font-weight:400;font-size:17px;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.item .val{font-size:15px;color:var(--gold);white-space:nowrap}
.empty{border:1px dashed var(--line);padding:28px;text-align:center;color:var(--muted);margin-top:24px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* schede di sezione */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:18px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab .n{color:var(--gold);margin-right:6px}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tab.done::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:7px;vertical-align:middle}
section.pane{padding-block:22px 10px}
.card{border:1px solid var(--line);background:var(--surface);padding:22px;margin-bottom:16px}
.card h2{display:flex;align-items:baseline;gap:12px;margin:0 0 18px;font-weight:400;font-size:13px;letter-spacing:.24em;text-transform:uppercase}
.card h2:after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.hint{font-size:13.5px;color:var(--muted);margin:-6px 0 14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px 16px}
.grid .wide{grid-column:1/-1}
label.f{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.fld{min-width:0}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{display:block;width:100%;min-width:0;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:10px 11px;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:90px;resize:vertical;line-height:1.55}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{flex:0 0 20px;width:20px;height:20px;margin:2px 0 0;accent-color:var(--gold)}
.chk .t{flex:1;min-width:0}
.chk .t input{margin-top:8px;min-height:40px;font-size:15px}

/* righe ripetibili */
.rows{display:grid;gap:12px}
.row{border:1px solid var(--line);padding:14px;position:relative;background:var(--bg)}
.row .rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.row .rhead b{font-weight:400;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.addrow{margin-top:12px}
.sum{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:15px}
.sum b{font-weight:400;color:var(--gold);font-size:18px}

/* tabelle di calcolo */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t th{font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
table.t td:first-child,table.t th:first-child{text-align:left;white-space:normal}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--gold)}
.result{border:1px solid var(--gold);background:var(--gold-soft);padding:20px;margin-bottom:16px}
.result .big{font-size:clamp(26px,6vw,36px);letter-spacing:.04em;color:var(--gold);margin:4px 0}
.result small{color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-left:2px solid var(--gold);padding:12px 16px;font-size:14px;line-height:1.6;margin-bottom:16px}
.notice.err{border-left-color:var(--danger)}
.notice.ok{border-left-color:var(--ok)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .in{display:flex;gap:10px;align-items:center}
.bar .in .grow{flex:1;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:860px;margin:auto;background:var(--ink);color:var(--bg);padding:13px 16px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:none}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:22px;max-width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(30,28,22,.45)}
dialog h3{margin:0 0 10px;font-weight:400;font-size:14px;letter-spacing:.2em;text-transform:uppercase}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media(max-width:560px){.word small{display:none}.card{padding:16px}.bar .in .grow{display:none}.bar .btn{flex:1;padding:0 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <button class="brand" type="button" id="goHome" aria-label="Elenco delle perizie">
      <svg class="mark" viewBox="72 75 435 407" aria-hidden="true"><rect x="72" y="75" width="435" height="407" fill="#84754e"/><polygon points="290,75 507,482 72,482" fill="#fff"/><polygon points="290,277 397,482 180,482" fill="#84754e"/></svg>
      <span class="word"><b>Perizie <span>Private</span></b><small>Purarchitettura · stima del valore di mercato</small></span>
    </button>

  </div>
</header>
<main class="wrap" id="app"></main>
<div class="bar" id="bar" hidden><div class="wrap in">
  <span class="grow" id="saved"></span>

</div></div>

<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script>
"use strict";
/* =====================================================================
   PERIZIE PRIVATE — stima del valore di mercato con il metodo del confronto
   di mercato (MCA). I dati restano SOLO su questo dispositivo (IndexedDB
   "perizie-private"); «Backup» salva un file .json da conservare.
   REGOLE PER GLI AGGIORNAMENTI: mai cancellare o rinominare l'archivio
   IndexedDB né i campi esistenti delle perizie; si possono solo aggiungere
   campi nuovi (con valori predefiniti per le perizie già salvate).
   Il sito ospita anche altre app: chiavi locali con prefisso "pp_",
   copie offline con prefisso "pp-".
   ===================================================================== */
const VERSIONE = "1.0 · 17/11/2026";
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v; else if(k==="text") e.textContent=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="value") e.value=v; else if(k==="checked") e.checked=!!v;
    else e.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat(9)){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
let toastT; function toast(m,ms){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),ms||3200); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function oggi(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function itData(iso){ if(!iso) return ""; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); return m?`${m[3]}/${m[2]}/${m[1]}`:iso; }
/* numeri: accetta "1.234,56", "1234,56", "1234.56" */
function num(v){ if(v==null) return NaN; if(typeof v==="number") return v; let s=String(v).trim().replace(/[€\s]/g,""); if(!s) return NaN; if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,""); const n=Number(s); return isFinite(n)?n:NaN; }
function has(v){ return isFinite(num(v)); }
function n0(v){ const n=num(v); return isFinite(n)?n:0; }
const fmt=(n,d=0)=>isFinite(n)?n.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const eur=(n,d=0)=>isFinite(n)?"€ "+fmt(n,d):"—";
function arrotonda(v,passo){ const p=n0(passo)||1; return Math.round(v/p)*p; }

/* ---------- importi in lettere (euro interi) ---------- */
function inLettere(n){
  n=Math.round(Math.abs(n));
  if(n===0) return "zero";
  const u=["","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
  const d=["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];
  function c999(x){
    let s=""; const c=Math.floor(x/100), r=x%100;
    if(c) s+=(c===1?"cento":u[c]+"cento");
    if(c && Math.floor(r/10)===8) s=s.slice(0,-1);   // centottanta
    if(r<20) s+=u[r];
    else { let t=d[Math.floor(r/10)]; const k=r%10; if(k===1||k===8) t=t.slice(0,-1); s+=t+u[k]; }
    return s;
  }
  const mld=Math.floor(n/1e9), mln=Math.floor(n%1e9/1e6), mil=Math.floor(n%1e6/1e3), r=n%1e3;
  let s="";
  if(mld) s+=(mld===1?"unmiliardo":c999(mld)+"miliardi");
  if(mln) s+=(mln===1?"unmilione":c999(mln)+"milioni");
  if(mil) s+=(mil===1?"mille":c999(mil)+"mila");
  if(r) s+=c999(r);
  return s;
}

/* ---------- archivio sul dispositivo ---------- */
const DB={
  db:null,
  open(){ return this.db?Promise.resolve(this.db):new Promise((ok,ko)=>{ const r=indexedDB.open("perizie-private",1); r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("perizie")) r.result.createObjectStore("perizie",{keyPath:"id"}); }; r.onsuccess=()=>{ this.db=r.result; ok(this.db); }; r.onerror=()=>ko(r.error); }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((ok,ko)=>{ const t=db.transaction("perizie",mode); const st=t.objectStore("perizie"); let out; Promise.resolve(fn(st)).then(v=>out=v); t.oncomplete=()=>ok(out); t.onerror=()=>ko(t.error); }); },
  all(){ return this.tx("readonly",st=>new Promise(ok=>{ const r=st.getAll(); r.onsuccess=()=>ok(r.result||[]); })); },
  put(p){ return this.tx("readwrite",st=>{ st.put(JSON.parse(JSON.stringify(p))); }); },
  del(id){ return this.tx("readwrite",st=>{ st.delete(id); }); }
};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ---------- modello della perizia ---------- */
const DOC_STD=[
  ["provenienza","Atto di provenienza"],["visura","Visura catastale"],["planimetria","Planimetria catastale"],["mappa","Estratto di mappa"],
  ["titoli","Titoli edilizi (licenze, concessioni, permessi, DIA/SCIA/CILA, condoni)"],["agibilita","Agibilità / abitabilità"],["ape","Attestato di prestazione energetica (APE)"],
  ["condominio","Regolamento condominiale, tabelle millesimali e spese"],["impianti","Dichiarazioni di conformità degli impianti"],["altro","Altro"]
];
const MANUT=[["1","1 · Scadente"],["2","2 · Mediocre"],["3","3 · Normale"],["4","4 · Buono"],["5","5 · Ottimo"]];
/* Coefficienti di partenza (rapporti mercantili) secondo il D.P.R. 138/1998, Allegato C: sempre modificabili. */
const TIPI_SUP=[
  ["principale","Vani principali e accessori diretti",1],
  ["acc_com","Accessori comunicanti (cantina, soffitta, ripostiglio)",0.5],
  ["acc_noncom","Accessori non comunicanti (cantina, soffitta)",0.25],
  ["balcone","Balconi e terrazze comunicanti (fino a 25 m²)",0.3],
  ["balcone_ecc","Balconi e terrazze comunicanti (oltre 25 m²)",0.1],
  ["balcone_nc","Balconi e terrazze non comunicanti (fino a 25 m²)",0.15],
  ["giardino","Giardino / area scoperta (fino alla superficie dei vani)",0.1],
  ["giardino_ecc","Giardino / area scoperta (eccedenza)",0.02],
  ["garage","Autorimessa / posto auto",""],
  ["altro","Altro",""]
];
function nuovaPerizia(){
  const t=new Date().toISOString();
  return {
    id:uid(), creata:t, modificata:t, formato:1,
    incarico:{ numero:"", committente:"", cf:"", recapiti:"", indirizzoCommittente:"", scopo:"compravendita", scopoAltro:"", dataIncarico:oggi(), dataSopralluogo:"", dataValutazione:oggi(), presenti:"",
      perito:lsGet("pp_perito")||"", qualifica:lsGet("pp_qualifica")||"", contattiPerito:lsGet("pp_contatti")||"" },
    documenti:{ voci:Object.fromEntries(DOC_STD.map(([k])=>[k,{ok:false,note:""}])), note:"" },
    immobile:{ indirizzo:"", civico:"", cap:"", comune:"", provincia:"", piano:"", interno:"", scala:"", tipologia:"", descrizione:"", confini:"", anno:"", manutenzione:"3", impianti:"", classeEnergetica:"", ascensore:"", bagni:"", note:"" },
    catasto:[{ id:uid(), catasto:"Fabbricati", comune:"", sezione:"", foglio:"", particella:"", sub:"", categoria:"", classe:"", consistenza:"", superficie:"", rendita:"" }],
    titolarita:[{ id:uid(), intestatario:"", diritto:"Proprietà", quota:"100", provenienza:"Compravendita", notaio:"", repertorio:"", raccolta:"", dataAtto:"", trascrizione:"" }],
    conformita:{ ante67:"", titoli:"", urbanistica:"", urbanisticaNote:"", catastale:"", catastaleNote:"", vincoli:"", servitu:"", convenzioni:"", condominio:"", occupazione:"", occupazioneNote:"" },
    superfici:[{ id:uid(), descrizione:"Abitazione", tipo:"principale", lorda:"", coeff:"1" }],
    mercato:{ segmento:"", fonti:"", note:"" },
    mca:{ comparabili:[], parametri:{ saggioAnnuo:"", rapportoPiano:"", costoBagno:"", deprezzamentoBagno:"", costoManutenzione:"", arrotondamento:"1000", soglia:"5" }, extra:[] },
    conclusione:{ detrazioni:[], considerazioni:"", assunzioni:"", luogo:"" }
  };
}
function nuovoComparabile(){ return { id:uid(), fonte:"Atto di compravendita", riferimento:"", indirizzo:"", data:"", prezzo:"", superficie:"", piano:"", bagni:"", manutenzione:"3", note:"", extra:{} }; }
/* compatibilità: aggiunge i campi mancanti alle perizie salvate con versioni precedenti */
function completa(p){ const b=nuovaPerizia(); (function fill(t,s){ for(const k of Object.keys(s)){ if(t[k]===undefined) t[k]=JSON.parse(JSON.stringify(s[k])); else if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==="object") fill(t[k],s[k]); } })(p,b); return p; }

/* ---------- calcoli ---------- */
function supCommerciale(p){ return p.superfici.reduce((a,r)=>a+n0(r.lorda)*n0(r.coeff),0); }
function mesiTra(a,b){ if(!a||!b) return NaN; const da=new Date(a), db=new Date(b); return (db-da)/(864e5*30.4375); }
function calcolaMCA(p){
  const P=p.mca.parametri, comps=p.mca.comparabili.filter(c=>has(c.prezzo)&&has(c.superficie)&&n0(c.superficie)>0);
  const dv=p.incarico.dataValutazione||oggi();
  const sog={ S:supCommerciale(p), L:num(p.immobile.piano), N:num(p.immobile.bagni), M:num(p.immobile.manutenzione), extra:Object.fromEntries(p.mca.extra.map(x=>[x.id,num(x.soggetto)])) };
  const out={ sog, comps, righe:[], avvisi:[], dv, ok:false };
  if(!(sog.S>0)) out.avvisi.push("Manca la superficie commerciale dell'immobile da stimare (sezione Superfici).");
  if(comps.length<3) out.avvisi.push(`Servono almeno 3 comparabili completi di prezzo e superficie: ora ${comps.length}.`);
  if(!comps.length||!(sog.S>0)) return out;
  const i=num(P.saggioAnnuo), rP=num(P.rapportoPiano), cB=num(P.costoBagno), dB=n0(P.deprezzamentoBagno), cM=num(P.costoManutenzione);
  const pSup=Math.min(...comps.map(c=>n0(c.prezzo)/n0(c.superficie)));
  const car=[];
  car.push({ k:"data", nome:"Data del contratto", unita:"mesi", attiva:isFinite(i),
    pm:c=>n0(c.prezzo)*i/100/12, diff:c=>mesiTra(c.data,dv), nota:isFinite(i)?`saggio annuo ${fmt(i,2)}%`:"saggio annuo non indicato" });
  car.push({ k:"sup", nome:"Superficie commerciale", unita:"m²", attiva:true,
    pm:()=>pSup, diff:c=>sog.S-n0(c.superficie), nota:`prezzo medio minimo ${eur(pSup,2)}/m²` });
  car.push({ k:"piano", nome:"Livello di piano", unita:"piani", attiva:isFinite(rP)&&isFinite(sog.L),
    pm:c=>n0(c.prezzo)*rP/100, diff:c=>sog.L-num(c.piano), nota:isFinite(rP)?`rapporto ${fmt(rP,2)}% per piano`:"rapporto non indicato" });
  car.push({ k:"bagni", nome:"Servizi igienici", unita:"n.", attiva:isFinite(cB)&&isFinite(sog.N),
    pm:()=>cB*(1-dB/100), diff:c=>sog.N-num(c.bagni), nota:isFinite(cB)?`costo ${eur(cB)} − deprezzamento ${fmt(dB,0)}%`:"costo non indicato" });
  car.push({ k:"manut", nome:"Stato di manutenzione", unita:"livelli", attiva:isFinite(cM)&&isFinite(sog.M),
    pm:c=>cM*n0(c.superficie), diff:c=>sog.M-num(c.manutenzione), nota:isFinite(cM)?`${eur(cM,2)}/m² per livello`:"costo non indicato" });
  for(const x of p.mca.extra){ const pm=num(x.prezzo); car.push({ k:"x_"+x.id, nome:x.nome||"Caratteristica", unita:x.unita||"", attiva:isFinite(pm)&&isFinite(sog.extra[x.id]),
    pm:()=>pm, diff:c=>sog.extra[x.id]-num((c.extra||{})[x.id]), nota:isFinite(pm)?`${eur(pm)} per ${x.unita||"unità"}`:"prezzo non indicato" }); }
  for(const ch of car){
    const r={ ...ch, valori:[] };
    for(const c of comps){
      let pm=NaN, df=NaN, adj=0;
      if(ch.attiva){ pm=ch.pm(c); df=ch.diff(c); if(!isFinite(df)){ out.avvisi.push(`${ch.nome}: dato mancante per il comparabile «${c.indirizzo||c.riferimento||"senza nome"}» (aggiustamento 0).`); df=NaN; } adj=isFinite(pm)&&isFinite(df)?pm*df:0; }
      r.valori.push({ pm, df, adj });
    }
    out.righe.push(r);
  }
  out.corretti=comps.map((c,j)=>n0(c.prezzo)+out.righe.reduce((a,r)=>a+r.valori[j].adj,0));
  const mn=Math.min(...out.corretti), mx=Math.max(...out.corretti);
  out.divergenza=mn>0?(mx-mn)/mn*100:NaN;
  out.media=out.corretti.reduce((a,b)=>a+b,0)/out.corretti.length;
  out.passo=n0(P.arrotondamento)||1;
  out.detrazioni=p.conclusione.detrazioni.reduce((a,d)=>a+n0(d.importo),0);
  out.valore=arrotonda(out.media-out.detrazioni,out.passo);
  out.unitario=out.valore/sog.S;
  const soglia=n0(P.soglia)||5;
  out.attendibile=isFinite(out.divergenza)&&out.divergenza<=soglia;
  out.soglia=soglia;
  if(isFinite(out.divergenza)&&!out.attendibile) out.avvisi.push(`Divergenza tra i prezzi corretti ${fmt(out.divergenza,1)}%: supera la soglia del ${fmt(soglia,1)}%. Verificare comparabili e parametri.`);
  out.ok=comps.length>=3&&out.corretti.every(v=>v>0);
  return out;
}

function completata(k,p){
  switch(k){
    case "incarico": return !!(p.incarico.committente&&p.incarico.dataValutazione&&p.incarico.perito);
    case "documenti": return Object.values(p.documenti.voci).some(v=>v.ok);
    case "immobile": return !!(p.immobile.indirizzo&&p.immobile.comune&&p.immobile.descrizione);
    case "catasto": return p.catasto.some(c=>c.foglio&&c.particella)&&p.titolarita.some(t=>t.intestatario);
    case "conformita": return !!(p.conformita.urbanistica&&p.conformita.catastale);
    case "superfici": return supCommerciale(p)>0;
    case "comparabili": return calcolaMCA(p).comps.length>=3;
    case "valutazione": return calcolaMCA(p).ok;
    case "conclusione": return !!p.conclusione.considerazioni;
  }
  return false;
}

  for(const a of r.avvisi) B.push(P("Nota: "+a,{sz:16,color:"A33A2C"}));

  B.push(H1("8. Conclusione"));
  if(r.ok){
    B.push(P("Sulla base di quanto esposto, il più probabile valore di mercato dell'immobile alla data del "+itData(r.dv)+" è pari a:",{after:80}));
    B.push(par(run(eur(r.valore),{b:true,sz:30,color:GOLD})+run("   (euro "+inLettere(r.valore)+"/00)",{sz:20}),{after:160,jc:"left"}));
  } else B.push(P("Valore non determinato: completare i dati della valutazione.",{color:"A33A2C"}));
  if(p.conclusione.considerazioni) B.push(P(p.conclusione.considerazioni));
  if(p.conclusione.assunzioni){ B.push(H2("Assunzioni e limiti")); B.push(P(p.conclusione.assunzioni)); }
  B.push(P([p.conclusione.luogo,itData(oggi())].filter(Boolean).join(", "),{before:300}));
  B.push(par(run("Il perito",{color:MUTED}),{before:200,jc:"right",after:0}));
  B.push(par(run(I.perito||"",{b:true}),{jc:"right",after:600}));
  B.push(par(run("_______________________________",{color:MUTED}),{jc:"right"}));

  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const sect=`<w:sectPr><w:headerReference w:type="default" r:id="rIdHdr"/><w:footerReference w:type="default" r:id="rIdFtr"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="510" w:gutter="0"/></w:sectPr>`;
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document ${NS}><w:body>${B.join("")}${sect}</w:body></w:document>`;
  const tab=`<w:r><w:tab/></w:r>`;
  const header=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:hdr ${NS}>`+par(run(I.perito||"",{b:true,sz:18})+tab+run("RELAZIONE DI STIMA",{sz:15,color:GOLD,sp:20}),{after:0}).replace("<w:pPr>",`<w:pPr><w:tabs><w:tab w:val="right" w:pos="${CW}"/></w:tabs>`)+par(run(I.contattiPerito||"",{sz:14,color:MUTED}),{border:true,after:0})+`</w:hdr>`;
  const fld=c=>`<w:r><w:rPr><w:sz w:val="14"/><w:color w:val="${MUTED}"/></w:rPr><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:rPr><w:sz w:val="14"/><w:color w:val="${MUTED}"/></w:rPr><w:instrText xml:space="preserve"> ${c} </w:instrText></w:r><w:r><w:rPr><w:sz w:val="14"/><w:color w:val="${MUTED}"/></w:rPr><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:rPr><w:sz w:val="14"/><w:color w:val="${MUTED}"/></w:rPr><w:t>1</w:t></w:r><w:r><w:rPr><w:sz w:val="14"/><w:color w:val="${MUTED}"/></w:rPr><w:fldChar w:fldCharType="end"/></w:r>`;
  const footer=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:ftr ${NS}><w:p><w:pPr><w:tabs><w:tab w:val="right" w:pos="${CW}"/></w:tabs><w:spacing w:after="0"/></w:pPr>${run(nomePerizia(p),{sz:14,color:MUTED})}${tab}${run("Pag. ",{sz:14,color:MUTED})}${fld("PAGE")}${run(" di ",{sz:14,color:MUTED})}${fld("NUMPAGES")}</w:p></w:ftr>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Arial" w:cs="Arial"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:color w:val="${INK}"/><w:lang w:val="it-IT"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="100" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;
  const settings=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:updateFields w:val="true"/><w:defaultTabStop w:val="708"/><w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdSettings" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/><Relationship Id="rIdHdr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rIdFtr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>`;
  const now=new Date().toISOString().replace(/\.\d+Z$/,"Z");
  const core=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xe("Relazione di stima - "+nomePerizia(p))}</dc:title><dc:creator>${xe(I.perito)}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`;
  const types=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;
  const root=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
  return makeZip([{name:"[Content_Types].xml",data:types},{name:"_rels/.rels",data:root},{name:"docProps/core.xml",data:core},{name:"word/document.xml",data:documentXml},{name:"word/_rels/document.xml.rels",data:rels},{name:"word/styles.xml",data:styles},{name:"word/settings.xml",data:settings},{name:"word/header1.xml",data:header},{name:"word/footer1.xml",data:footer}]);
}
$("btnWord").addEventListener("click",async()=>{
  if(!corrente) return;
  const r=calcolaMCA(corrente);
  if(!r.ok&&!confirm("La valutazione non è completa (servono almeno 3 comparabili e la superficie). Creare comunque la relazione?")) return;
  const blob=buildDocx(corrente), nome=`Relazione_di_stima_${slug(nomePerizia(corrente))}.docx`;
  let file=null; try{ file=new File([blob],nome,{type:blob.type}); }catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){ try{ await navigator.share({files:[file],title:nome}); return; }catch(e){ if(e.name==="AbortError") return; } }
  scarica(blob,nome); toast("Relazione Word scaricata: "+nome,4500);
});

/* ---------- avvio ---------- */
$("goHome").addEventListener("click",()=>{ if(corrente&&saveT){ clearTimeout(saveT); DB.put(corrente); } vistaElenco(); });
vistaElenco().catch(e=>{ $("app").replaceChildren(h("div",{class:"notice err",style:"margin-top:24px"},"Archivio del dispositivo non disponibile: "+e.message+". In navigazione privata i dati non possono essere salvati.")); });
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});
</script>
