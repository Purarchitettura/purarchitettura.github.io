<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Condominio Playa Grande</title>
<meta name="description" content="Gestione del condominio Playa Grande e Playa Piccolo: unità, quote di spesa, confronto versioni, richieste, punti aperti, agenda.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Condominio Playa">
<style>
/* Stile purarchitettura.it: fondo bianco, Arial, titoli maiuscoli spaziati, accento oro, pulsanti a pillola */
:root{--bg:#fff;--surface:#fff;--soft:#f6f4ef;--ink:#333;--muted:#7a7a7a;--faint:#a9a9a9;--line:#e4e1da;--gold:#84754e;--gold-ink:#fff;--gold-soft:#f1ede3;--danger:#a33a2c;--ok:#4d6b3c;--warn-bg:#f7f1e1;--warn-ink:#6b5a2e;--f:Arial,"Helvetica Neue",Helvetica,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161513;--surface:#1e1d1a;--soft:#24221e;--ink:#e8e5de;--muted:#a8a399;--faint:#7d786e;--line:#34312b;--gold:#b8a676;--gold-ink:#161513;--gold-soft:#2b2820;--danger:#e08a7d;--ok:#a6c48f;--warn-bg:#2b2820;--warn-ink:#e3d3a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161513;--surface:#1e1d1a;--soft:#24221e;--ink:#e8e5de;--muted:#a8a399;--faint:#7d786e;--line:#34312b;--gold:#b8a676;--gold-ink:#161513;--gold-soft:#2b2820;--danger:#e08a7d;--ok:#a6c48f;--warn-bg:#2b2820;--warn-ink:#e3d3a6;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f);-webkit-text-size-adjust:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
[hidden],.hidden{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

header.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:12px;min-height:62px;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0;flex:1 1 auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark{width:34px;height:32px;flex:none}
.word{display:grid;line-height:1.15;min-width:0}
.word b{font-weight:400;font-size:18px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word b span{color:var(--gold)}
.word small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border:1px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.gold{border-color:var(--gold);color:var(--gold)}.btn.gold:hover{background:var(--gold);color:var(--gold-ink)}
.btn.solid{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}.btn.solid:hover{filter:brightness(.93)}
.btn.quiet{border-color:var(--line);color:var(--muted)}.btn.quiet:hover{background:var(--soft);color:var(--ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)}.btn.danger:hover{background:var(--danger);color:#fff}
.btn.small{min-height:32px;padding:0 13px;font-size:10.5px}
.btn.icon{padding:0;width:34px;min-height:34px}

.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0}
h1.title{font-weight:400;font-size:clamp(24px,5vw,34px);letter-spacing:.16em;text-transform:uppercase;margin:6px 0 0;line-height:1.2}
.rule{width:64px;height:1px;background:var(--gold);border:0;margin:16px 0 0}
.lead{color:var(--muted);max-width:64ch;margin:12px 0 0;font-size:15px}
.hero{padding-block:30px 8px}

/* elenco perizie */
.list{display:grid;gap:12px;margin-top:24px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;border:1px solid var(--line);background:var(--surface);padding:16px 18px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--gold)}
.item b{font-weight:400;font-size:17px;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.item .val{font-size:15px;color:var(--gold);white-space:nowrap}
.empty{border:1px dashed var(--line);padding:28px;text-align:center;color:var(--muted);margin-top:24px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* schede di sezione */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:18px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab .n{color:var(--gold);margin-right:6px}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tab.done::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:7px;vertical-align:middle}
section.pane{padding-block:22px 10px}
.card{border:1px solid var(--line);background:var(--surface);padding:22px;margin-bottom:16px}
.card h2{display:flex;align-items:baseline;gap:12px;margin:0 0 18px;font-weight:400;font-size:13px;letter-spacing:.24em;text-transform:uppercase}
.card h2:after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.hint{font-size:13.5px;color:var(--muted);margin:-6px 0 14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px 16px}
.grid .wide{grid-column:1/-1}
label.f{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.fld{min-width:0}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{display:block;width:100%;min-width:0;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:10px 11px;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:90px;resize:vertical;line-height:1.55}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{flex:0 0 20px;width:20px;height:20px;margin:2px 0 0;accent-color:var(--gold)}
.chk .t{flex:1;min-width:0}
.chk .t input{margin-top:8px;min-height:40px;font-size:15px}

/* righe ripetibili */
.rows{display:grid;gap:12px}
.row{border:1px solid var(--line);padding:14px;position:relative;background:var(--bg)}
.row .rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.row .rhead b{font-weight:400;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.addrow{margin-top:12px}
.sum{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:15px}
.sum b{font-weight:400;color:var(--gold);font-size:18px}

/* tabelle di calcolo */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t th{font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
table.t td:first-child,table.t th:first-child{text-align:left;white-space:normal}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--gold)}
.result{border:1px solid var(--gold);background:var(--gold-soft);padding:20px;margin-bottom:16px}
.result .big{font-size:clamp(26px,6vw,36px);letter-spacing:.04em;color:var(--gold);margin:4px 0}
.result small{color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-left:2px solid var(--gold);padding:12px 16px;font-size:14px;line-height:1.6;margin-bottom:16px}
.notice.err{border-left-color:var(--danger)}
.notice.ok{border-left-color:var(--ok)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .in{display:flex;gap:10px;align-items:center}
.bar .in .grow{flex:1;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:860px;margin:auto;background:var(--ink);color:var(--bg);padding:13px 16px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:none}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:22px;max-width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(30,28,22,.45)}
dialog h3{margin:0 0 10px;font-weight:400;font-size:14px;letter-spacing:.2em;text-transform:uppercase}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media(max-width:560px){.word small{display:none}.card{padding:16px}.bar .in .grow{display:none}.bar .btn{flex:1;padding:0 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* --- Condominio Playa: aggiunte --- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px;margin-top:22px}
.kpi{border:1px solid var(--line);background:var(--surface);padding:16px 18px}
.kpi small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-weight:400;font-size:22px;color:var(--gold);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.filters input[type=search]{flex:1 1 220px;min-width:0;font-size:16px;border:1px solid var(--line);background:var(--bg);padding:10px 11px;min-height:44px}
.filters select{width:auto;flex:0 1 auto}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{background:none;border:0;padding:9px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;min-height:42px}
.seg button.on{background:var(--gold);color:var(--gold-ink)}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:2px 8px;border-radius:999px;color:var(--muted);white-space:nowrap}
.pill.gold{border-color:var(--gold);color:var(--gold)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.err{border-color:var(--danger);color:var(--danger)}
.pos{color:var(--danger)}.neg{color:var(--ok)}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--soft)}
table.t td.l,table.t th.l{text-align:left}
.entry{border:1px solid var(--line);background:var(--surface);padding:14px 16px;display:grid;gap:4px}
.entry .h{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.entry .h b{font-weight:400;font-size:16px;overflow-wrap:anywhere}
.entry p{margin:0;color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.entry .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.entry.done{opacity:.62}
.stack{display:grid;gap:10px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px 14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-variant-numeric:tabular-nums}
dialog.wide{max-width:min(760px,calc(100vw - 32px));width:100%}
dialog form{display:grid;gap:12px}
.sec-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.da{color:var(--warn-ink);background:var(--warn-bg);padding:0 4px}
#print{display:none}
@media print{
  body{padding:0;background:#fff;color:#000}
  header.top,#app,.bar,.bnav,#toast,dialog{display:none!important}
  #print{display:block;font:11pt/1.45 Arial,sans-serif;color:#000;padding:0}
  #print h1{font-size:15pt;font-weight:400;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}
  #print h2{font-size:10pt;font-weight:400;letter-spacing:.18em;text-transform:uppercase;margin:16px 0 6px;border-bottom:1px solid #84754e;padding-bottom:3px}
  #print table{border-collapse:collapse;width:100%;font-size:10pt}
  #print td,#print th{border-bottom:1px solid #ccc;padding:5px 6px;text-align:right}
  #print td:first-child,#print th:first-child{text-align:left}
  #print tr.tot td{font-weight:700;border-top:1.5px solid #84754e}
  #print .foot{margin-top:18px;font-size:9pt;color:#555}
}
/* --- versione telefono --- */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));font-size:16px}
.top-in{min-height:54px}
.phead{padding:18px 0 4px}
.phead h1{font-weight:400;font-size:24px;letter-spacing:.1em;text-transform:uppercase;margin:0;line-height:1.2;overflow-wrap:anywhere}
.phead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.back{background:none;border:0;padding:6px 0;margin:0 0 4px;color:var(--gold);font-size:15px;cursor:pointer;min-height:36px}
section.pane{padding-block:10px 20px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-right))}
.bnav button{position:relative;display:grid;justify-items:center;gap:2px;background:none;border:0;padding:6px 2px 4px;min-height:56px;color:var(--muted);cursor:pointer;font-size:11px;letter-spacing:.04em}
.bnav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on{color:var(--gold)}
.bnav button.on svg{stroke-width:2}
.bnav i{position:absolute;top:3px;left:calc(50% + 6px);font-style:normal;background:var(--gold);color:var(--gold-ink);font-size:10.5px;min-width:18px;height:18px;line-height:18px;border-radius:9px;padding:0 5px}
@media(min-width:900px){.bnav{max-width:640px;margin:0 auto;border:1px solid var(--line);border-bottom:0}}
#toast{bottom:calc(80px + env(safe-area-inset-bottom))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);padding:14px;cursor:pointer;min-width:0}
.tile:active{background:var(--soft)}
.tile small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile b{font-weight:400;font-size:21px;color:var(--gold);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.25}
.tile span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2.sec{font-weight:400;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.list{border:1px solid var(--line);background:var(--surface)}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);min-height:52px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:16px}
.li:first-child{border-top:0}
.list .li[role=button],.li.link{cursor:pointer}
.list .li[role=button]:active,.li.link:active{background:var(--soft)}
.li.link{border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.li-l{min-width:0;overflow-wrap:anywhere}
.li-l small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.45}
.li-r{flex:none;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.searchbar input{width:100%;font-size:17px;border:1px solid var(--line);background:var(--bg);padding:12px 14px;min-height:50px;border-radius:0}
.searchbar input:focus{border-color:var(--gold);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:0 15px;min-height:38px;font-size:14px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.ulist{display:grid;gap:8px}
@media(min-width:760px){.ulist{grid-template-columns:1fr 1fr}}
.ucard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);padding:12px 14px;min-height:64px;cursor:pointer}
.ucard:active{background:var(--soft)}
.ur{display:grid;justify-items:start;gap:3px;min-width:52px}
.ur b{font-weight:400;font-size:18px;letter-spacing:.03em}
.up{min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.up small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uv{font-size:15px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.faint{color:var(--faint)}
.sub-h{color:var(--muted);font-size:14px;margin:0 0 12px}
.owner{border:1px solid var(--line);background:var(--surface);padding:14px;margin-bottom:12px}
.owner small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.owner b{display:block;font-weight:400;font-size:18px;margin-top:3px;overflow-wrap:anywhere}
.owner .btns{margin-top:10px}
.result{padding:16px;margin-bottom:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btns.center{justify-content:center}
.btns .btn{flex:1 1 auto;min-height:46px}
.btns .btn.small{min-height:38px;flex:0 1 auto}
details.box{border:1px solid var(--line);background:var(--surface);margin-top:12px}
details.box>summary{list-style:none;cursor:pointer;padding:14px;min-height:50px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";color:var(--gold);font-size:20px;line-height:1}
details.box[open]>summary::after{content:"–"}
details.box>.list{border-left:0;border-right:0;border-bottom:0}
details.box>.form,details.box>ul,details.box>.hint{padding:0 14px 14px;margin:0}
details.box ul{padding-left:30px}
details.box ul li{margin:4px 0;overflow-wrap:anywhere}
.pane>.hint{margin:10px 0 8px}
.form{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin:4px 0}
.steps li.ok{color:var(--ok);text-decoration:line-through}
.notice .btns{margin-top:10px}
.empty{padding:22px 16px}
dialog{width:calc(100vw - 20px);max-width:620px;max-height:calc(100dvh - 20px);overflow:auto;padding:18px}
dialog .list{margin:10px 0}
.entry{padding:14px}
.entry .acts .btn{min-height:38px}
@media(max-width:420px){.phead h1{font-size:21px}.grid2{grid-template-columns:1fr}.word small{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <button class="brand" type="button" id="goHome" aria-label="Quadro generale">
      <svg class="mark" viewBox="72 75 435 407" aria-hidden="true"><rect x="72" y="75" width="435" height="407" fill="#84754e"/><polygon points="290,75 507,482 72,482" fill="#fff"/><polygon points="290,277 397,482 180,482" fill="#84754e"/></svg>

<input type="file" id="fileXls" accept=".ods,.xlsx,.xls,.xlsm,.csv,application/vnd.oasis.opendocument.spreadsheet,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<input type="file" id="fileJson" accept="application/json,.json" hidden>
<script>
'use strict';
/* Condominio Playa Grande · Purarchitettura
   Dati solo su questo dispositivo (IndexedDB "condominio-playa"). Nessun invio a server.
   Regola: importazioni e aggiornamenti non cancellano mai ciò che gli utenti hanno inserito. */
const APP_VERSION = '1.1 telefono e anagrafica · 26/11/2026';
const DB_NAME = 'condominio-playa', LS = 'cpg_';
const FAB = { PG: 'Playa Grande', PP: 'Playa Piccolo', '?': 'Da assegnare' };
const VOCI = [
  ['pc', 'Parti comuni'], ['ter', 'Pav. terrazze'], ['pog', 'Poggioli'], ['pav', 'Pav. poggioli'], ['tot', 'Totale']
];
const VOCI_IMPORT = [
  ['rif', 'Unità (riferimento)', ['unit', 'rif', 'appart', 'immobile', 'u.i', 'interno']],
  ['sub', 'Subalterno', ['sub']],
  ['fab', 'Fabbricato (facoltativo)', ['fabbric', 'edificio', 'blocco', 'condominio']],
  ['mill', 'Millesimi', ['millesim', 'mill']],
  ['pc', 'Parti comuni', ['parti comuni', 'spese comuni', 'comuni']],
  ['ter', 'Pavimentazione terrazze', ['terrazz']],
  ['pog', 'Poggioli', ['poggiol']],
  ['pav', 'Pavimentazione poggioli', ['pavimentazion']],
  ['tot', 'Totale (facoltativo: se manca è la somma)', ['totale']]
];
const STATI_RICH = ['Aperta', 'In lavorazione', 'Risposta inviata', 'Chiusa'];
const STATI_PUNTO = ['Aperto', 'In verifica', 'Risolto'];
const TIPI_AGENDA = ['Assemblea', 'Scadenza', 'Sopralluogo', 'Riunione', 'Altro'];
const CAT_DOC = ['Cartella', 'Computo', 'Riepilogo costi', 'Fascicoli', 'Progetto', 'Normativa', 'Contratto', 'Verbale', 'Altro'];

/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const oggi = () => new Date().toISOString().slice(0, 10);
function fmt(n, d) { const neg = n < 0; let [i, f] = Math.abs(Number(n)).toFixed(d).split('.'); i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg && Number(i.replace(/\./g, '') + '.' + (f || 0)) !== 0 ? '-' : '') + i + (d ? ',' + f : ''); }
const eur = n => (n == null || isNaN(n)) ? '—' : '€ ' + fmt(n, 2);
const num2 = (n, d = 2) => (n == null || isNaN(n)) ? '—' : fmt(n, d);
const sgn = n => n > 0.004 ? '+' + eur(n) : n < -0.004 ? '−' + eur(-n) : eur(0);
const dataIt = s => s ? s.split('-').reverse().join('/') : '';
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
function toNum(v) {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).replace(/[€\s]/g, '').trim();
  if (!s || s === '/' || s === '-' || s === '—') return 0;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/,/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}
function lsGet(k, d) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch { } }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); }
function csv(rows) { return '\ufeff' + rows.map(r => r.map(c => { const s = typeof c === 'number' ? String(c).replace('.', ',') : String(c ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n'); }
async function copia(txt) { try { await navigator.clipboard.writeText(txt); toast('Copiato'); } catch { prompt('Copia il testo:', txt); } }

/* ---------- unità: fabbricato, piano, ordinamento ---------- */
function normRif(s) { return String(s ?? '').trim().toUpperCase().replace(/\s+/g, ' '); }
function normSub(s) { let t = String(s ?? '').trim(); if (typeof s === 'number') t = String(s); return t.replace(/\s+/g, ''); }
function fabDa(rif, sub, hint) {
  if (hint === 'PG' || hint === 'PP') return hint;
  const s = String(sub || '');
  if (/^211\b|^211\//.test(s)) return 'PG';
  if (/^212\b|^212\//.test(s)) return 'PP';
  let m = /^A(\d)(\d{2})$/.exec(rif); if (m) return +m[2] <= 21 ? 'PG' : 'PP';
  m = /^AT\s?(\d{1,2})$/.exec(rif); if (m) return +m[1] <= 10 ? 'PG' : 'PP';
  m = /^([NR])(\d{1,2})$/.exec(rif); if (m) { const n = +m[2]; if (m[1] === 'N') return n <= 3 ? 'PG' : 'PP'; return n <= 2 ? 'PG' : 'PP'; }
  if (/^P\b/.test(rif)) return 'PP';
  return '?';
}
function pianoDi(rif) {
  let m = /^A(\d)\d{2}$/.exec(rif); if (m) return m[1] + '° piano';
  if (/^AT/.test(rif)) return 'Attico';
  if (/^[NR]\d/.test(rif)) return 'Piano terra';
  if (/^P\b/.test(rif)) return 'Posto auto';
  return '';
}
function chiave(fab, rif, sub) { return [fab, normRif(rif), normSub(sub)].join('|'); }
function ordUnita(a, b) {
  const k = u => { const r = u.rif; let m = /^A(\d)(\d{2})$/.exec(r); if (m) return [1, +m[2], +m[1]]; m = /^AT(\d+)/.exec(r); if (m) return [2, +m[1], 0]; m = /^([NR])(\d+)/.exec(r); if (m) return [m[1] === 'N' ? 3 : 4, +m[2], 0]; return [5, 0, 0]; };
  if (a.fab !== b.fab) return a.fab < b.fab ? -1 : 1;
  const x = k(a), y = k(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
  return (a.rif + a.sub).localeCompare(b.rif + b.sub, 'it', { numeric: true });
}

/* ---------- archivio (IndexedDB) ---------- */
let db, S;
function dbOpen() { return new Promise((ok, ko) => { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
function dbGet(k) { return new Promise((ok, ko) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
function dbPut(k, v) { return new Promise((ok, ko) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => ok(); tx.onerror = () => ko(tx.error); }); }
let saveT;
function salva() { S.modificato = new Date().toISOString(); clearTimeout(saveT); saveT = setTimeout(() => dbPut('stato', S).then(() => {  }).catch(e => toast('Salvataggio non riuscito: ' + e.message)), 250); }

/* Stato iniziale vuoto: il codice della pagina è pubblico, quindi qui non ci sono dati del condominio.
   I dati di partenza (punti aperti, richieste, contatti, documenti) si caricano con «Carica backup». */
function statoIniziale() {
  return { v: 1, creato: new Date().toISOString(), dati: { nome: 'Condominio Playa Grande e Playa Piccolo', indirizzo: '', comune: '', mappali: '', lavori: '', impresa: '', contratto: '', amministratore: '', note: '' },
    unita: {}, versioni: [], attiva: null, richieste: [], punti: [], agenda: [], contatti: [], documenti: [] };
}
function migra(s) {
  for (const k of ['unita']) if (!s[k]) s[k] = {};
  for (const k of ['versioni', 'richieste', 'punti', 'agenda', 'contatti', 'documenti']) if (!Array.isArray(s[k])) s[k] = [];
  if (!s.dati) s.dati = {};
  return s;
}

/* ---------- versioni del riepilogo costi ---------- */
const versione = id => S.versioni.find(v => v.id === id);
const attiva = () => versione(S.attiva) || S.versioni[S.versioni.length - 1] || null;
function precedente(v) { const i = S.versioni.indexOf(v); return i > 0 ? S.versioni[i - 1] : null; }
function totaliDi(v, fab) {
  const t = { pc: 0, ter: 0, pog: 0, pav: 0, tot: 0, mill: 0, n: 0 };
  for (const r of v.righe) { if (fab && r.fab !== fab) continue; for (const k of ['pc', 'ter', 'pog', 'pav', 'tot', 'mill']) t[k] += r[k] || 0; t.n++; }
  for (const k in t) t[k] = r2(t[k]); return t;
}
function rigaDi(v, u) {
  if (!v) return null;
  return v.righe.find(r => r.key === u.key) || v.righe.find(r => r.fab === u.fab && r.rif === u.rif && (!u.sub || !r.sub)) || null;
}
function abbina(a, b) { // a,b versioni → righe abbinate per chiave
  const out = [], viste = new Set();
  const idx = new Map(b.righe.map(r => [r.key, r]));
  for (const r of a.righe) { const s = idx.get(r.key) || b.righe.find(x => x.fab === r.fab && x.rif === r.rif && !viste.has(x.key)); if (s) viste.add(s.key); out.push([r, s || null]); }
  for (const s of b.righe) if (!viste.has(s.key) && !a.righe.some(r => r.key === s.key)) out.push([null, s]);
  return out;
}

/* ---------- interfaccia (pensata prima per il telefono) ---------- */
const ICO = {
  quadro: '<path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z"/>',
  unita: '<rect x="5" y="3.5" width="14" height="17" rx="1"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10.5 20.5v-4h3v4"/>',
  costi: '<path d="M16.5 7.2A6 6 0 1 0 16.5 16.8M5 10.5h8M5 13.5h8"/>',
  richieste: '<path d="M4.5 5.5h15v10h-9l-4 3.5v-3.5h-2z"/>',
  altro: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>'
};
const NAV = [['quadro', 'Quadro'], ['unita', 'Unità'], ['costi', 'Costi'], ['richieste', 'Richieste'], ['altro', 'Altro']];
const SUB = { punti: 'Punti aperti', agenda: 'Agenda', contatti: 'Contatti', documenti: 'Documenti', dati: 'Dati e backup' };
const TITOLI = { quadro: 'Playa Grande', unita: 'Unità', costi: 'Costi', richieste: 'Richieste', altro: 'Altro', ...SUB };
let tab = lsGet('tab', 'quadro'), sel = null;
const F = { q: '', fab: lsGet('fab', ''), senzaProp: false, cq: '', soloVar: true, cA: null, cB: null, ordC: 'diff', pq: '', pStato: 'aperti', rStato: 'aperte' };
const nAperte = () => S.richieste.filter(r => r.stato !== 'Chiusa' && r.stato !== 'Risposta inviata').length;
const nPunti = () => S.punti.filter(p => p.stato !== 'Risolto').length;

function render() {
  if (!TITOLI[tab]) tab = 'quadro';
  const navOn = SUB[tab] ? 'altro' : tab;
  $('#bnav').innerHTML = NAV.map(([k, l]) => {
    const n = k === 'richieste' ? nAperte() : k === 'altro' ? nPunti() : 0;
    return `<button type="button" data-tab="${k}" class="${k === navOn ? 'on' : ''}" aria-label="${l}"${k === navOn ? ' aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg><span>${l}</span>${n ? `<i>${n}</i>` : ''}</button>`;
  }).join('');
  const app = $('#app');
  const back = SUB[tab] ? `<button class="back" data-tab="altro">‹ Altro</button>` : (tab === 'unita' && sel ? `<button class="back" data-act="indietro">‹ Unità</button>` : '');
  const tit = tab === 'unita' && sel && S.unita[sel] ? S.unita[sel].rif : TITOLI[tab];
  const sotto = tab === 'quadro' ? esc([S.dati.indirizzo, S.dati.comune].filter(Boolean).join(' · ') || S.dati.nome || '') : '';
  app.innerHTML = `<div class="phead">${back}<h1>${esc(tit)}</h1>${sotto ? `<p>${sotto}</p>` : ''}</div><section class="pane" id="pane"></section>`;
  ({ quadro: vQuadro, unita: vUnita, costi: vCosti, richieste: vRichieste, altro: vAltro, punti: vPunti, agenda: vAgenda, contatti: vContatti, documenti: vDocumenti, dati: vDati })[tab]($('#pane'));
}
function vai(t) { tab = t; lsSet('tab', t); sel = null; render(); window.scrollTo(0, 0); }
const riga = (label, valore, extra = '', attr = '') => `<div class="li"${attr}><div class="li-l">${label}${extra ? `<small>${extra}</small>` : ''}</div><div class="li-r">${valore}</div></div>`;
const diffCls = d => d > 0.004 ? 'pos' : d < -0.004 ? 'neg' : 'muted';

/* Quadro */
function vQuadro(el) {
  const v = attiva(); const us = Object.values(S.unita);
  const prossimi = S.agenda.filter(a => !a.fatto && a.data && a.data >= oggi()).sort((a, b) => a.data.localeCompare(b.data)).slice(0, 3);
  const rich = S.richieste.filter(r => r.stato !== 'Chiusa' && r.stato !== 'Risposta inviata');
  const senzaProp = us.filter(u => !u.prop).length;
  let h = '';
  if (!v || !us.length || (!S.punti.length && !S.richieste.length)) {
    h += `<div class="notice"><b>Per iniziare</b><ol class="steps">
      <li class="${v ? 'ok' : ''}">Importa il <b>Riepilogo costi</b> (.ods o .xlsx): crea le unità con millesimi e quote.</li>
      <li class="${us.some(u => u.prop) ? 'ok' : ''}">Importa l'<b>anagrafica</b> dei proprietari.</li>
      <li class="${S.punti.length || S.richieste.length ? 'ok' : ''}">Carica il file <b>Playa_dati_iniziali.json</b> con punti aperti, contatti e documenti.</li></ol>
      <div class="btns"><button class="btn solid" data-act="importa">Riepilogo costi</button><button class="btn gold" data-act="anagrafica">Anagrafica</button><button class="btn quiet" data-act="ripristina">Dati iniziali</button></div></div>`;
  }
  h += `<div class="tiles">
    <button class="tile" data-tab="unita"><small>Unità</small><b>${us.length}</b><span>${us.length ? `Grande ${us.filter(u => u.fab === 'PG').length} · Piccolo ${us.filter(u => u.fab === 'PP').length}` : 'da importare'}</span></button>
    <button class="tile" data-tab="costi"><small>Totale ripartito</small><b>${v ? eur(totaliDi(v).tot) : '—'}</b><span>${v ? esc(v.nome) : 'nessuna versione'}</span></button>
    <button class="tile" data-tab="richieste"><small>Richieste aperte</small><b>${rich.length}</b><span>condòmini e amministratore</span></button>
    <button class="tile" data-tab="punti"><small>Punti aperti</small><b>${nPunti()}</b><span>da verificare</span></button></div>`;
  if (us.length && senzaProp) h += `<button class="li link" data-act="filtroSenzaProp"><div class="li-l">Unità senza proprietario</div><div class="li-r">${senzaProp} ›</div></button>`;
  if (v) {
    const t = totaliDi(v), g = totaliDi(v, 'PG'), pp = totaliDi(v, 'PP'), p = precedente(v), tp = p ? totaliDi(p) : null;
    h += `<h2 class="sec">Ripartizione per voce</h2><div class="list">`;
    for (const [k, l] of VOCI) { const d = tp ? r2(t[k] - tp[k]) : 0; h += riga(k === 'tot' ? '<b>Totale</b>' : l, k === 'tot' ? `<b>${eur(t[k])}</b>` : eur(t[k]), `Grande ${eur(g[k])} · Piccolo ${eur(pp[k])}${tp && Math.abs(d) > 0.004 ? ` · <span class="${diffCls(d)}">${sgn(d)}</span>` : ''}`); }
    h += `</div>${tp ? `<p class="hint">Differenze rispetto a «${esc(p.nome)}».</p>` : ''}`;
  }
  h += `<h2 class="sec">Prossime date</h2>${prossimi.length ? `<div class="stack">${prossimi.map(entryAgenda).join('')}</div>` : '<p class="muted small">Nessuna data in programma.</p>'}`;
  if (rich.length) h += `<h2 class="sec">Richieste aperte</h2><div class="stack">${rich.slice(0, 3).map(entryRich).join('')}</div>`;
  el.innerHTML = h;
}

/* Unità */
function vUnita(el) {
  if (sel) return vSchedaUnita(el, S.unita[sel]);
  const v = attiva(), q = F.q.toLowerCase().trim();
  const tutte = Object.values(S.unita);
  const us = tutte.filter(u => (!F.fab || u.fab === F.fab) && (!F.senzaProp || !u.prop) && (!q || [u.rif, u.sub, u.prop, u.email, u.tel, u.note, (u.owners || []).map(o => o.cf).join(' ')].join(' ').toLowerCase().includes(q))).sort(ordUnita);
  let h = `<div class="searchbar"><input type="search" id="fq" placeholder="Cerca A104, sub, nome…" value="${esc(F.q)}" autocomplete="off"></div>
  <div class="chips">${[['', 'Tutte'], ['PG', 'Grande'], ['PP', 'Piccolo']].map(([k, l]) => `<button data-fab="${k}" class="chip${F.fab === k ? ' on' : ''}">${l}</button>`).join('')}<button data-act="toggleSenzaProp" class="chip${F.senzaProp ? ' on' : ''}">Senza proprietario</button></div>`;
  if (!tutte.length) h += `<div class="empty">Nessuna unità.<br>Importa il riepilogo costi o l'anagrafica: le unità vengono create da sole.<div class="btns center"><button class="btn solid" data-act="importa">Riepilogo costi</button><button class="btn gold" data-act="anagrafica">Anagrafica</button></div></div>`;
  else {
    h += `<p class="hint">${us.length} di ${tutte.length} unità${v ? ' · totale per unità dalla versione «' + esc(v.nome) + '»' : ''}</p><div class="ulist">`;
    for (const u of us) {
      const r = rigaDi(v, u);
      h += `<button class="ucard" data-unita="${esc(u.key)}"><span class="ur"><b>${esc(u.rif)}</b><span class="pill">${u.fab === '?' ? '?' : u.fab}</span></span><span class="up">${u.prop ? esc(u.prop) : '<span class="faint">Proprietario non inserito</span>'}<small>${u.sub ? 'sub ' + esc(u.sub) + ' · ' : ''}${num2(u.mill)} mill.</small></span><span class="uv">${r ? eur(r.tot) : ''}</span></button>`;
    }
    h += `</div>`;
  }
  h += `<div class="btns"><button class="btn quiet small" data-act="anagrafica">Importa anagrafica</button><button class="btn quiet small" data-act="nuovaUnita">Nuova unità</button><button class="btn quiet small" data-act="csvUnita">Esporta CSV</button></div>`;
  el.innerHTML = h;
  const fq = $('#fq'); if (fq) fq.oninput = () => { F.q = fq.value; const p = fq.selectionStart; vUnita(el); const n = $('#fq'); n.focus(); n.setSelectionRange(p, p); };
}
function vSchedaUnita(el, u) {
  if (!u) { sel = null; return vUnita(el); }
  const v = attiva(), r = rigaDi(v, u), p = v && precedente(v), rp = p && rigaDi(p, u);
  const rich = S.richieste.filter(x => x.rif && normRif(x.rif) === u.rif && (!x.fab || x.fab === u.fab));
  const cont = S.contatti.filter(c => c.rif && normRif(c.rif) === u.rif);
  const tel = (u.tel || '').split(/[;,/]/).map(s => s.trim()).filter(Boolean);
  const mail = (u.email || '').split(/[;,\s]+/).map(s => s.trim()).filter(s => s.includes('@'));
  let h = `<p class="sub-h">${esc(FAB[u.fab])}${pianoDi(u.rif) ? ' · ' + esc(pianoDi(u.rif)) : ''}${u.sub ? ' · sub ' + esc(u.sub) : ''} · ${num2(u.mill)} millesimi</p>`;
  h += `<div class="owner"><small>Proprietario</small><b>${u.prop ? esc(u.prop) : '<span class="faint">non inserito</span>'}</b>
   <div class="btns">${tel.map(t => `<a class="btn gold" href="tel:${esc(t.replace(/[^\d+]/g, ''))}">Chiama ${esc(t)}</a>`).join('')}${mail.map(m => `<a class="btn gold" href="mailto:${esc(m)}">Email</a>`).join('')}${!tel.length && !mail.length ? '<span class="faint small">Nessun recapito</span>' : ''}</div></div>`;
  if (r) {
    h += `<div class="result"><small>Quota totale · ${esc(v.nome)}</small><div class="big">${eur(r.tot)}</div>${rp ? `<small>Prima (${esc(p.nome)}): ${eur(rp.tot)} · <span class="${diffCls(r.tot - rp.tot)}">${sgn(r2(r.tot - rp.tot))}</span></small>` : ''}</div>

/* Costi */
function vCosti(el) {
  const v = attiva();

  if (!S.versioni.length) { h += `<div class="empty">Nessuna versione importata.<br><span class="small">Accetta .ods, .xlsx, .xls e .csv. Riconosce da solo le colonne del foglio RIPARTIZIONE TOTALE e ti fa controllare l'abbinamento prima di salvare.</span></div>`; el.innerHTML = h; return; }
  if (S.versioni.length > 1) h += vConfrontoHtml();
  h += `<h2 class="sec">Versioni importate</h2><div class="stack">`;
  for (const x of S.versioni.slice().reverse()) {
    h += `<div class="entry"><div class="h"><b>${esc(x.nome)}</b>${x === v ? '<span class="pill gold">Attiva</span>' : ''}</div><p>${dataIt(x.data)} · ${x.righe.length} unità · ${eur(totaliDi(x).tot)}</p><p class="small">File ${esc(x.file || '')} · foglio ${esc(x.foglio || '')}${x.note ? '\n' + esc(x.note) : ''}</p>
    <div class="acts">${x !== v ? `<button class="btn gold small" data-act="attiva" data-id="${x.id}">Rendi attiva</button>` : ''}<button class="btn quiet small" data-act="rinominaV" data-id="${x.id}">Rinomina</button><button class="btn quiet small" data-act="csvV" data-id="${x.id}">CSV</button><button class="btn quiet small" data-act="eliminaV" data-id="${x.id}">Elimina</button></div></div>`;
  }
  h += `</div>`;
  el.innerHTML = h;
  bindConfronto(el);
}
function vConfrontoHtml() {
  const vs = S.versioni;
  const A = versione(F.cA) || vs[vs.length - 2], B = versione(F.cB) || vs[vs.length - 1];
  F.cA = A.id; F.cB = B.id;
  const ta = totaliDi(A), tb = totaliDi(B);
  let h = `<h2 class="sec" id="confronto">Confronto</h2><div class="grid2">
   <div class="fld"><label class="f">Prima</label><select id="cA">${vs.map(x => `<option value="${x.id}"${x === A ? ' selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></div>
   <div class="fld"><label class="f">Ora</label><select id="cB">${vs.map(x => `<option value="${x.id}"${x === B ? ' selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></div></div><div class="list">`;
  for (const [k, l] of VOCI) { const d = r2(tb[k] - ta[k]); h += riga(k === 'tot' ? '<b>Totale</b>' : l, `<span class="${diffCls(d)}">${sgn(d)}</span>`, `${eur(ta[k])} → ${eur(tb[k])}${ta[k] ? ' · ' + num2(d / ta[k] * 100, 1) + '%' : ''}`); }
  h += `</div>`;
  const rows = abbina(A, B).map(([a, b]) => ({ a, b, u: b || a, d: r2((b ? b.tot : 0) - (a ? a.tot : 0)) }));
  const nPiu = rows.filter(r => r.d > 0.004).length, nMeno = rows.filter(r => r.d < -0.004).length;
  const q = F.cq.toLowerCase().trim();
  let vis = rows.filter(r => (!F.soloVar || Math.abs(r.d) > 0.004 || !r.a || !r.b) && (!q || (r.u.rif + ' ' + r.u.sub).toLowerCase().includes(q)));
  vis.sort(F.ordC === 'diff' ? (x, y) => Math.abs(y.d) - Math.abs(x.d) : (x, y) => ordUnita(x.u, y.u));
  h += `<p class="hint"><span class="neg">${nMeno} pagano meno</span> · <span class="pos">${nPiu} pagano di più</span>${rows.some(r => !r.a || !r.b) ? ' · ' + rows.filter(r => !r.a || !r.b).length + ' in una sola versione' : ''}</p>
  <div class="searchbar"><input type="search" id="cq" placeholder="Filtra unità…" value="${esc(F.cq)}" autocomplete="off"></div>
  <div class="chips"><button class="chip${F.soloVar ? ' on' : ''}" data-act="toggleSoloVar">Solo variate</button><button data-ord="diff" class="chip${F.ordC === 'diff' ? ' on' : ''}">Per differenza</button><button data-ord="unita" class="chip${F.ordC === 'unita' ? ' on' : ''}">Per unità</button></div><div class="list">`;
  for (const r of vis.slice(0, 300)) {
    const det = VOCI.slice(0, 4).map(([k, l]) => { const d = r2((r.b ? r.b[k] : 0) - (r.a ? r.a[k] : 0)); return Math.abs(d) > 0.004 ? `${l} ${sgn(d)}` : ''; }).filter(Boolean).join(' · ');
    const u = S.unita[r.u.key];
    h += riga(`<b>${esc(r.u.rif)}</b> <span class="pill">${r.u.fab}</span>${!r.a ? ' <span class="pill gold">nuova</span>' : !r.b ? ' <span class="pill err">assente</span>' : ''}`, `<span class="${diffCls(r.d)}">${sgn(r.d)}</span>`, `${r.a ? eur(r.a.tot) : '—'} → ${r.b ? eur(r.b.tot) : '—'}${det ? '<br>' + det : ''}`, u ? ` data-unita="${esc(u.key)}" role="button" tabindex="0"` : '');
  }
  h += `</div>${vis.length > 300 ? '<p class="hint">Mostrate le prime 300: usa il filtro o il CSV.</p>' : ''}<div class="btns"><button class="btn quiet small" data-act="csvConfronto">Esporta confronto CSV</button></div>`;
  return h;
}
function bindConfronto(el) {
  const re = () => { const y = window.scrollY; vCosti(el); window.scrollTo(0, y); };
  const a = $('#cA'), b = $('#cB'); if (!a) return;
  a.onchange = () => { F.cA = a.value; re(); }; b.onchange = () => { F.cB = b.value; re(); };

function ics(a) {
  const d = a.data.replace(/-/g, ''); const m = /^(\d{1,2})[:.](\d{2})$/.exec(a.ora || '');
  const pad = n => String(n).padStart(2, '0');
  const t = m ? `DTSTART;TZID=Europe/Rome:${d}T${pad(m[1])}${m[2]}00\r\nDURATION:PT2H` : `DTSTART;VALUE=DATE:${d}`;

    const testoRiga = low(r.filter(c => typeof c === 'string').join(' '));
    if (/playa piccolo/.test(testoRiga)) sez = 'PP'; else if (/playa grande/.test(testoRiga)) sez = 'PG';
    const rif = normRif(m.rif != null ? r[m.rif] : '');
    if (!rif || /TOTAL|SOMMA|SUBTOT|RIPORT/.test(rif) || rif.length > 24) continue;
    const val = k => m[k] != null ? toNum(r[m[k]]) : 0;
    const x = { rif, sub: m.sub != null ? normSub(r[m.sub]) : '', mill: val('mill'), pc: val('pc'), ter: val('ter'), pog: val('pog'), pav: val('pav') };
    x.tot = m.tot != null ? val('tot') : r2(x.pc + x.ter + x.pog + x.pav);
    if (!x.mill && !x.pc && !x.ter && !x.pog && !x.pav && !x.tot) { scarti.push(rif); continue; }

    for (const k of ['mill', 'pc', 'ter', 'pog', 'pav', 'tot']) x[k] = r2(x[k] * (k === 'mill' ? 1 : 1));

  ['indirizzo', 'Indirizzo di residenza', t => /indirizzo/.test(t)],
  ['comune', 'Comune di residenza', t => /comune/.test(t)],
  ['tel', 'Telefono', t => /^tel|cell/.test(t)],
  ['email', 'Email', t => /mail|pec/.test(t)],
  ['sopr', 'Data sopralluogo', t => /sopralluogo/.test(t) && /data/.test(t)],
  ['noteSopr', 'Note sopralluogo', t => /note/.test(t)]
];
function headAnag(rows) {
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    const H = (rows[i] || []).map(low);
    if (H.some(t => /cognome|nominativ|proprietar/.test(t)) && H.some(t => /^sub|interno|civico|^rif/.test(t))) return i;
  }
  return -1;
}
function mappaAnag(head) {
  const H = head.map(low), m = {}, usati = new Set();
  for (const [k, , test] of CAMPI_ANAG) { const j = H.findIndex((t, x) => t && !usati.has(x) && test(t)); if (j >= 0) { m[k] = j; usati.add(j); } }
  return m;
}
function dataCella(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number' && window.XLSX) { const d = XLSX.SSF.parse_date_code(v); if (d) return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`; }
  const s = pulisci(v); const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(s); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : s;
}
function leggiAnag(XLSX, wb, nomeFile) {
  const out = [], avvisi = [];
  for (const nome of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: '' });
    const hi = headAnag(rows); if (hi < 0) continue;
    const m = mappaAnag(rows[hi]); let cur = null;
    const val = (r, k) => m[k] != null ? r[m[k]] : '';
    for (let i = hi + 1; i < rows.length; i++) {
      const r = rows[i] || [], dove = `${nomeFile} · ${nome} · riga ${i + 1}`;
      const sub = pulisci(val(r, 'sub')), cog = pulisci(val(r, 'cognome')), nom = pulisci(val(r, 'nome'));
      if (sub) {
        const mapp = pulisci(val(r, 'mapp')); const mm = /(\d+)\s*$/.exec(mapp);
        const mappale = mm ? mm[1] : '';
        let rif = normRif(val(r, 'rif'));
        const fab = mappale === '211' ? 'PG' : mappale === '212' ? 'PP' : fabDa(rif, '');
        const subN = mappale ? mappale + '/' + sub : sub;
        if (!rif) avvisi.push(`${dove}: sub ${subN} senza riferimento dell'unità (importata come «SUB ${sub}»)`);
        else if (!/^(A\d{3}|AT\d{2}|[NR]\d{2}|P)$/.test(rif)) avvisi.push(`${dove}: sub ${subN} ha un riferimento insolito «${rif}»`);
        const mill = toNum(val(r, 'mill'));
        if (!mill) avvisi.push(`${dove}: sub ${subN} (${rif || 'senza rif.'}) senza millesimi`);
        cur = { fab, rif: rif || 'SUB ' + sub, sub: subN, piano: pulisci(val(r, 'piano')), cat: pulisci(val(r, 'cat')), mill, sopr: dataCella(val(r, 'sopr')), noteSopr: pulisci(val(r, 'noteSopr')), owners: [], foglio: nome, file: nomeFile.replace(/^[0-9a-f]{8}-/, '') };
        out.push(cur);
      } else if ((cog || nom) && !cur) { avvisi.push(`${dove}: proprietario senza unità, ignorato`); continue; }
      else if (!(cog || nom)) continue;
      else if (toNum(val(r, 'mill'))) avvisi.push(`${dove}: millesimi (${num2(toNum(val(r, 'mill')))}) sulla riga del cointestatario ${cog} ${nom} dell'unità ${cur.rif}: non importati`);
      if (cog || nom) {
        const tel = pulisci(val(r, 'tel')), email = pulisci(val(r, 'email'));
        cur.owners.push({ cognome: cog, nome: nom, cf: pulisci(val(r, 'cf')).toUpperCase(), nascita: dataCella(val(r, 'nascita')), luogo: pulisci(val(r, 'luogo')), indirizzo: pulisci(val(r, 'indirizzo')), comune: pulisci(val(r, 'comune')), tel: tel === '0' ? '' : tel, email: email === '0' ? '' : email });
      }
    }
  }
  return { unita: out, avvisi };
}
async function importaAnagrafica(files) {
  let XLSX; try { XLSX = await caricaXLSX(); } catch (e) { return toast(e.message); }
  const tutte = [], avvisi = [], nomi = [];
  for (const f of files) {
    try { const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }); const r = leggiAnag(XLSX, wb, f.name); tutte.push(...r.unita); avvisi.push(...r.avvisi); nomi.push(f.name); }
    catch (e) { avvisi.push(`${f.name}: file non leggibile (${e.message})`); }
  }
  // piano: abbinamento con le unità già presenti
  const piano = tutte.map(a => { const u = trovaUnita(a.fab, a.rif, a.sub); return { a, u }; });
  const dlg = $('#dlgImport');
  let sovrascrivi = false;
  const conta = () => {
    let nuove = 0, abb = 0, aggiorna = 0, diversi = [];
    for (const { a, u } of piano) {
      if (!u) { nuove++; continue; } abb++;
      const nuovo = riassuntoProp(a.owners);
      if (!u.owners || !u.owners.length) { if (!u.prop || u.prop === nuovo) aggiorna++; else diversi.push(`${u.rif}: «${u.prop}» → «${nuovo}»`); }
      else if (riassuntoProp(u.owners) !== nuovo) diversi.push(`${u.rif}: «${riassuntoProp(u.owners)}» → «${nuovo}»`);
      if (u.mill && a.mill && Math.abs(u.mill - a.mill) > 0.004) diversi.push(`${u.rif}: millesimi ${num2(u.mill)} nell'app, ${num2(a.mill)} nell'anagrafica (non modificati)`);
    }
    return { nuove, abb, aggiorna, diversi };
  };
  const disegna = () => {
    const c = conta(), nf = { PG: 0, PP: 0, '?': 0 }; tutte.forEach(a => nf[a.fab]++);
    const nOwn = tutte.reduce((s, a) => s + a.owners.length, 0);
    const nTel = tutte.reduce((s, a) => s + a.owners.filter(o => o.tel || o.email).length, 0);
    dlg.innerHTML = `<form method="dialog"><h3>Importa anagrafica</h3>
     <p class="small muted" style="margin:0;overflow-wrap:anywhere">${nomi.map(esc).join(' · ')}</p>
     ${tutte.length ? `<div class="list">
      ${riga('Unità lette', tutte.length, `Grande ${nf.PG} · Piccolo ${nf.PP}${nf['?'] ? ' · senza fabbricato ' + nf['?'] : ''}`)}
      ${riga('Proprietari', nOwn, `${nTel ? nTel + ' con telefono o email' : 'nei file non ci sono telefoni né email'}`)}
      ${riga('Già presenti nell\'app', c.abb, 'abbinate per fabbricato e subalterno')}
      ${riga('Nuove unità', c.nuove, '')}</div>` : '<div class="notice err">Non ho trovato unità: servono le colonne SUB e COGNOME (o nominativo).</div>'}
     ${avvisi.length ? `<details class="box" open><summary>Da controllare nei file (${avvisi.length})</summary><ul class="small">${avvisi.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
     ${c.diversi.length ? `<details class="box"><summary>Differenze con i dati già nell'app (${c.diversi.length})</summary><ul class="small">${c.diversi.slice(0, 60).map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>
       <label class="chk"><input type="checkbox" id="aSovr" ${sovrascrivi ? 'checked' : ''}><span class="t">Sostituisci i proprietari diversi con quelli dell'anagrafica<br><span class="small muted">Se non lo spunti, i proprietari già inseriti restano come sono.</span></span></label>` : ''}
     <p class="small muted" style="margin:0">Riempie solo i campi vuoti: non cancella note, telefoni, email o altri dati già inseriti. Millesimi e quote restano quelli del riepilogo costi.</p>
     <div class="acts"><button class="btn quiet" value="no">Annulla</button><button class="btn solid" id="aOk" value="ok" ${tutte.length ? '' : 'disabled'}>Importa</button></div></form>`;
    const s = $('#aSovr'); if (s) s.onchange = () => { sovrascrivi = s.checked; };
    $('#aOk').onclick = ev => {
      ev.preventDefault();
      let nuove = 0, agg = 0;
      const fonte = nomi.join(', ');
      for (const { a, u: u0 } of piano) {
        let u = u0;
        if (!u) {
          let key = chiave(a.fab, a.rif, a.sub); let n = 2; while (S.unita[key]) key = chiave(a.fab, a.rif + ' (' + n++ + ')', a.sub);
          u = S.unita[key] = { key, fab: a.fab, rif: a.rif, sub: a.sub, mill: a.mill, prop: '', email: '', tel: '', note: '', daImport: 'anagrafica' }; nuove++;
        }
        const nuovo = riassuntoProp(a.owners);
        const vuoto = !u.owners || !u.owners.length;
        if (vuoto || sovrascrivi) {
          if (!vuoto && riassuntoProp(u.owners) !== nuovo) u.ownersPrec = u.owners;
          u.owners = a.owners;
          if (!u.prop || sovrascrivi || u.prop === nuovo) u.prop = nuovo;
          agg++;
        }
        const tels = [...new Set(a.owners.map(o => o.tel).filter(Boolean))].join('; ');
        const mails = [...new Set(a.owners.map(o => o.email).filter(Boolean))].join('; ');
        if (!u.tel && tels) u.tel = tels;
        if (!u.email && mails) u.email = mails;
        if (!u.mill && a.mill) u.mill = a.mill;
        if (!u.cat && a.cat) u.cat = a.cat;
        if (!u.piano && a.piano) u.piano = a.piano;
        if (!u.sopralluogo && a.sopr) u.sopralluogo = a.sopr;
        if (a.noteSopr && !(u.note || '').includes(a.noteSopr)) u.note = [u.note, 'Sopralluogo: ' + a.noteSopr].filter(Boolean).join('\n');
        u.anagrafica = { file: a.file || fonte, foglio: a.foglio, data: oggi() };
      }
      salva(); dlg.close(); toast(`Anagrafica importata: ${agg} unità aggiornate, ${nuove} nuove`); vai('unita');
    };

}
function htmlOwners(u) {
  if (!u.owners || !u.owners.length) return '';
  return `<details class="box"><summary>Anagrafica (${u.owners.length} ${u.owners.length === 1 ? 'proprietario' : 'proprietari'})</summary><div class="list">${u.owners.map(o => riga(esc(nomeProp(o)), '', [o.cf ? 'C.F. ' + esc(o.cf) : '', o.nascita || o.luogo ? 'nato/a ' + [o.luogo ? 'a ' + esc(titolo(o.luogo)) : '', o.nascita ? 'il ' + dataIt(o.nascita) : ''].filter(Boolean).join(' ') : '', o.indirizzo || o.comune ? 'residenza ' + esc(titolo([o.indirizzo, o.comune].filter(Boolean).join(', '))) : '', o.tel ? 'tel. ' + esc(o.tel) : '', o.email ? esc(o.email) : ''].filter(Boolean).join('<br>'))).join('')}</div>
  <p class="hint">${u.cat ? 'Categoria ' + esc(u.cat) + ' · ' : ''}${u.piano ? 'piano ' + esc(u.piano) + ' · ' : ''}${u.sopralluogo ? 'sopralluogo ' + dataIt(u.sopralluogo) + ' · ' : ''}${u.anagrafica ? 'da ' + esc(u.anagrafica.file) + ' (' + dataIt(u.anagrafica.data) + ')' : ''}</p>${u.ownersPrec ? '<p class="hint">Proprietari precedenti conservati: ' + esc(riassuntoProp(u.ownersPrec)) + '</p>' : ''}</details>`;
}

/* ---------- scheda unità stampabile ---------- */
function testoUnita(u) {
  const v = attiva(), r = rigaDi(v, u);
  const L = [`${S.dati.nome || 'Condominio'} – ${FAB[u.fab]}`, `Unità ${u.rif}${u.sub ? ' – sub ' + u.sub : ''}${u.mill ? ' – ' + num2(u.mill) + ' millesimi' : ''}`];
  if (r) { L.push(`Quote di spesa (versione «${v.nome}», IVA e spese comprese):`); for (const [k, l] of VOCI.slice(0, 4)) L.push(`- ${l}: ${eur(r[k])}`); L.push(`Totale: ${eur(r.tot)}`); }
  return L.join('\n');
}
function stampaUnita(u) {
  const v = attiva(), r = rigaDi(v, u), p = v && precedente(v), rp = p && rigaDi(p, u);
  $('#print').innerHTML = `<h1>${esc(S.dati.nome || 'Condominio')}</h1><div>${esc(S.dati.indirizzo || '')} · ${esc(S.dati.comune || '')}</div>
  <h2>Unità</h2><table><tr><td>Riferimento</td><td>${esc(u.rif)}</td></tr><tr><td>Fabbricato</td><td>${esc(FAB[u.fab])}</td></tr><tr><td>Subalterno</td><td>${esc(u.sub || '—')}</td></tr><tr><td>Millesimi</td><td>${num2(u.mill)}</td></tr>${u.prop ? `<tr><td>Proprietario</td><td>${esc(u.prop)}</td></tr>` : ''}</table>

/* ---------- dialoghi ---------- */
function dialogo(titolo, corpo, onOk, onDel) {
  const d = $('#dlg');
  d.className = 'wide';
  d.innerHTML = `<form method="dialog"><h3>${esc(titolo)}</h3>${corpo}<div class="acts">${onDel ? '<button class="btn danger" value="del" type="button" id="dDel">Elimina</button><span style="flex:1"></span>' : ''}<button class="btn quiet" value="no" formnovalidate>Annulla</button><button class="btn solid" value="ok" id="dOk">Salva</button></div></form>`;
  const f = d.querySelector('form');
  f.onsubmit = e => {
    if (e.submitter && e.submitter.value !== 'ok') return;
    e.preventDefault(); if (!f.reportValidity()) return;
    const o = {}; f.querySelectorAll('[name]').forEach(i => o[i.name] = i.type === 'checkbox' ? i.checked : i.value.trim());
    d.close(); onOk(o);
  };
  if (onDel) $('#dDel').onclick = () => { if (confirm('Eliminare definitivamente?')) { d.close(); onDel(); } };
  d.showModal();
}
function chiedi(titolo, campi, onOk) { dialogo(titolo, campi, onOk); }

/* ---------- eventi ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-unita],[data-fab],[data-rstato],[data-pstato]'); if (!t) return;
  if (t.dataset.tab) return vai(t.dataset.tab);
  if (t.dataset.unita) { tab = 'unita'; lsSet('tab', tab); sel = t.dataset.unita; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.fab !== undefined && !t.dataset.act) { F.fab = t.dataset.fab; lsSet('fab', F.fab); return render(); }
  if (t.dataset.rstato) { F.rStato = t.dataset.rstato; return render(); }
  if (t.dataset.pstato) { F.pStato = t.dataset.pstato; return render(); }
  const id = t.dataset.id, a = t.dataset.act;
  const trova = (l) => S[l].find(x => x.id === id);
  switch (a) {
    case 'importa': $('#fileXls').click(); break;
    case 'anagrafica': $('#fileAnag').click(); break;
    case 'filtroSenzaProp': F.senzaProp = true; F.q = ''; vai('unita'); break;
    case 'toggleSenzaProp': F.senzaProp = !F.senzaProp; render(); break;
    case 'toggleSoloVar': { F.soloVar = !F.soloVar; const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'vaiConfronto': $('#confronto')?.scrollIntoView({ behavior: 'smooth' }); break;
    case 'attiva': S.attiva = id; salva(); render(); break;
    case 'rinominaV': { const v = versione(id); dialogo('Versione', `<div class="fld"><label class="f">Nome</label><input type="text" name="nome" value="${esc(v.nome)}" required></div><div class="fld"><label class="f">Note</label><textarea name="note">${esc(v.note || '')}</textarea></div>`, o => { v.nome = o.nome; v.note = o.note; salva(); render(); }); break; }
    case 'eliminaV': { const v = versione(id); if (confirm(`Eliminare la versione «${v.nome}»? Le unità e i dati inseriti a mano restano.`)) { S.versioni = S.versioni.filter(x => x !== v); if (S.attiva === id) S.attiva = S.versioni.length ? S.versioni[S.versioni.length - 1].id : null; salva(); render(); } break; }
    case 'csvV': { const v = versione(id); download('Riepilogo_' + v.nome.replace(/[^\w-]+/g, '_') + '.csv', new Blob([csv([['Fabbricato', 'Unità', 'Sub', 'Millesimi', ...VOCI.map(x => x[1])], ...v.righe.slice().sort(ordUnita).map(r => [FAB[r.fab], r.rif, r.sub, r.mill, ...VOCI.map(([k]) => r[k])])])], { type: 'text/csv' })); break; }

    }
    case 'csvUnita': { const v = attiva(); download('Unita_Playa_' + oggi().replace(/-/g, '') + '.csv', new Blob([csv([['Fabbricato', 'Unità', 'Sub', 'Millesimi', 'Proprietario', 'Email', 'Telefono', 'Note', ...(v ? VOCI.map(x => x[1]) : [])], ...Object.values(S.unita).sort(ordUnita).map(u => { const r = rigaDi(v, u); return [FAB[u.fab], u.rif, u.sub, u.mill, u.prop, u.email, u.tel, u.note, ...(v ? VOCI.map(([k]) => r ? r[k] : '') : [])]; })])], { type: 'text/csv' })); break; }
    case 'nuovaUnita': dialogo('Nuova unità', `<div class="grid"><div class="fld"><label class="f">Riferimento</label><input type="text" name="rif" required placeholder="es. A104"></div><div class="fld"><label class="f">Subalterno</label><input type="text" name="sub" placeholder="es. 211/14"></div><div class="fld"><label class="f">Fabbricato</label><select name="fab"><option value="">Automatico</option><option value="PG">Playa Grande</option><option value="PP">Playa Piccolo</option></select></div><div class="fld"><label class="f">Millesimi</label><input type="text" name="mill" inputmode="decimal"></div></div>`,
      o => { const rif = normRif(o.rif), sub = normSub(o.sub), fab = o.fab || fabDa(rif, sub); const k = chiave(fab, rif, sub); if (S.unita[k]) return toast('Unità già presente'); S.unita[k] = { key: k, fab, rif, sub, mill: toNum(o.mill), prop: '', email: '', tel: '', note: '' }; salva(); sel = k; render(); }); break;
    case 'indietro': sel = null; render(); break;

    case 'stampaUnita': stampaUnita(S.unita[sel]); break;
    case 'testoUnita': copia(testoUnita(S.unita[sel])); break;
    case 'nuovaRich': { formRich(null); if (t.dataset.rif) { const f = $('#dlg form'); f.rif.value = t.dataset.rif; } break; }
    case 'modRich': formRich(trova('richieste')); break;
    case 'nuovoPunto': formPunto(null); break;
    case 'modPunto': formPunto(trova('punti')); break;
    case 'risolvi': { const p = trova('punti'); p.stato = 'Risolto'; p.dataRisolto = oggi(); salva(); render(); toast('Segnato come risolto'); break; }
    case 'nuovaAgenda': formAgenda(null); break;
    case 'modAgenda': formAgenda(trova('agenda')); break;
    case 'ics': ics(trova('agenda')); break;
    case 'nuovoCont': formCont(null); break;
    case 'modCont': formCont(trova('contatti')); break;

  }
});
$('#goHome').onclick = () => vai('quadro');
$('#fileAnag').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importaAnagrafica(f); };
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); } });
$('#fileXls').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importa(f); };
$('#fileJson').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const n = unisci(JSON.parse(await f.text())); salva(); render(); toast(`Backup caricato: ${n} elementi aggiunti`); } catch (er) { toast(er.message); } };

/* ---------- avvio ---------- */
(async () => {
  try { db = await dbOpen(); S = await dbGet('stato'); } catch (e) { toast('Archivio del dispositivo non disponibile: i dati non verranno salvati'); }

  try { navigator.storage?.persist?.(); } catch { }

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
