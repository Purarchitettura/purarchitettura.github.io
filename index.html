    h('p', { class: 'lead' }, 'L\'account ', h('b', null, STATE.me.email), ' non è tra quelli abilitati a PuraStrumenti.'),

    h('div', { class: 'admin-bar' }, h('button', { class: 'btn gold', type: 'button', onclick: () => { Auth.signOut(); Auth.start(true); } }, 'Usa un altro account'))));
}
function Card(s) {
  const own = isOwnApp(s.url), isApp = s.tipo === 'app';
  return h('article', { class: 'card' },
    h('div', { class: 'card-head' },
      h('div', { class: 'mono' + (isApp ? '' : ' link'), 'aria-hidden': 'true' }, initials(s.nome)),
      h('div', { style: 'min-width:0' }, h('div', { class: 'kind' }, isApp ? 'App' : 'Collegamento'), h('h3', null, s.nome))),
    h('p', null, s.descrizione || ''),
    h('div', { class: 'acts' },
      h('a', { class: 'btn gold small', href: s.url, target: own ? null : '_blank', rel: own ? null : 'noopener' }, 'Apri', own ? null : icon('ext')),
      s.guida ? h('a', { class: 'btn quiet small', href: s.guida, target: '_blank', rel: 'noopener' }, icon('doc'), 'Guida') : null,
      h('span', { class: 'host' }, hostOf(s.url))));
}
function Home() {
  const cfg = STATE.draft || STATE.cfg;
  const groups = STATE.preview ? [STATE.preview] : (STATE.person?.gruppi || []);
  const all = visibleFor(cfg, groups);
  const q = norm(STATE.query);
  const list = q ? all.filter(s => norm([s.nome, s.descrizione, hostOf(s.url)].join(' ')).includes(q)) : all;
  const order = [...cfg.sezioni, ...new Set(list.map(s => s.sezione || 'Altro').filter(x => !cfg.sezioni.includes(x)))];
  const bySec = order.map(sec => [sec, list.filter(s => (s.sezione || 'Altro') === sec)]).filter(([, a]) => a.length);
  const nome = (STATE.me.name || '').split(' ')[0];
  const search = all.length > 6 ? h('label', { class: 'search' }, icon('search'), h('input', { id: 'q', type: 'search', placeholder: 'Cerca uno strumento', value: STATE.query, 'aria-label': 'Cerca uno strumento', oninput: e => { STATE.query = e.target.value; Home(); setTimeout(() => { const i = $('#q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); } })) : null;
  const gname = id => id === '*' ? 'Tutti' : (cfg.gruppi.find(g => g.id === id)?.nome || id);
  page(
    STATE.preview ? h('div', { class: 'preview-banner' }, 'Anteprima: vedi il portale come il gruppo «' + gname(STATE.preview) + '».', h('button', { class: 'btn gold small', type: 'button', onclick: () => { STATE.preview = null; Home(); } }, 'Torna alla tua vista')) : null,
    h('section', null,
      h('p', { class: 'eyebrow' }, nome ? 'Ciao ' + nome : 'Benvenuto'),
      h('h1', { class: 'title' }, 'Strumenti dello studio'), h('hr', { class: 'rule' }),
      h('p', { class: 'lead' }, all.length ? `${all.length === 1 ? 'Hai accesso a 1 strumento' : 'Hai accesso a ' + all.length + ' strumenti'}. Le app si aprono qui; i collegamenti esterni in una nuova scheda.` : 'Non ci sono ancora strumenti assegnati al tuo account.')),
    STATE.admin && !STATE.preview ? AdminBar() : null,
    search,
    bySec.length ? bySec.map(([sec, items]) => h('section', { class: 'section', 'aria-label': sec },
      h('div', { class: 'section-head' }, h('h2', null, sec), h('span', { class: 'count' }, String(items.length))),
      h('div', { class: 'grid' }, items.map(Card))))
      : h('div', { class: 'empty' }, q ? 'Nessuno strumento corrisponde a «' + STATE.query + '».' : 'Quando ti verranno assegnati degli strumenti li troverai qui.'),
    STATE.admin && STATE.adminOpen && !STATE.preview ? Admin() : null);
}

/* ---------- gestione (solo gruppo amministrazione) ---------- */
function AdminBar() {
  return h('div', { class: 'admin-bar' },
    h('button', { class: 'btn quiet small', type: 'button', onclick: () => { STATE.adminOpen = !STATE.adminOpen; Home(); if (STATE.adminOpen) setTimeout(() => $('#gestione')?.scrollIntoView({ behavior: 'smooth' }), 50); } }, icon('gear'), STATE.adminOpen ? 'Chiudi gestione' : 'Gestione'),
    STATE.draft ? h('span', { class: 'chip gold' }, 'Modifiche non pubblicate') : null);
}
function draft() { if (!STATE.draft) STATE.draft = JSON.parse(JSON.stringify(STATE.cfg)); return STATE.draft; }
function saveDraft() { LS.set('draft', { base: STATE.cfgSig, data: STATE.draft }); Home(); }
function Admin() {
  const cfg = STATE.draft || STATE.cfg;
  const tab = STATE.adminTab || 'schede';
  const setTab = t => { STATE.adminTab = t; Home(); $('#gestione')?.scrollIntoView(); };
  const gname = id => id === '*' ? 'Tutti' : (cfg.gruppi.find(g => g.id === id)?.nome || id);
  let body;
  if (tab === 'schede') {
    body = [h('div', { class: 'admin-bar' }, h('button', { class: 'btn gold small', type: 'button', onclick: () => editScheda(null) }, '+ Nuova scheda')),
      h('div', null, cfg.schede.length ? cfg.schede.map(s => h('div', { class: 'row' },
        h('div', { class: 'row-main' }, h('div', { class: 'row-title' }, s.nome, ' ', h('span', { class: 'chip' }, s.tipo === 'app' ? 'App' : 'Collegamento'), h('span', { class: 'chip' }, s.sezione || 'Altro')),
          h('div', { class: 'row-sub' }, s.url), h('div', null, (s.gruppi || []).map(g => h('span', { class: 'chip gold' }, gname(g))))),
        h('button', { class: 'btn quiet small', type: 'button', onclick: () => editScheda(s) }, 'Modifica'))) : h('div', { class: 'empty' }, 'Nessuna scheda.'))];
  } else if (tab === 'gruppi') {
    body = [h('div', { class: 'admin-bar' }, h('button', { class: 'btn gold small', type: 'button', onclick: () => editGruppo(null) }, '+ Nuovo gruppo')),
      h('div', null, cfg.gruppi.map(g => {
        const n = cfg.persone.filter(p => p.gruppi.includes(g.id)).length, ns = cfg.schede.filter(s => (s.gruppi || []).includes(g.id)).length;
        return h('div', { class: 'row' },
          h('div', { class: 'row-main' }, h('div', { class: 'row-title' }, g.nome), h('div', { class: 'row-sub' }, `${g.descrizione || ''}${g.descrizione ? ' · ' : ''}${n} ${n === 1 ? 'persona' : 'persone'}, ${ns} ${ns === 1 ? 'scheda' : 'schede'}`)),
          h('button', { class: 'btn quiet small', type: 'button', onclick: () => { STATE.preview = g.id; window.scrollTo(0, 0); Home(); } }, 'Anteprima'),
          h('button', { class: 'btn quiet small', type: 'button', onclick: () => editGruppo(g) }, 'Modifica'));
      }))];
  } else {
    body = [h('div', { class: 'admin-bar' }, h('button', { class: 'btn gold small', type: 'button', onclick: () => editPersona(null) }, '+ Aggiungi persona')),
      h('p', { class: 'note', style: 'margin:0' }, 'Le email non vengono salvate: nel file resta solo un\'impronta cifrata e l\'etichetta che scegli tu (es. nome e cognome).'),
      h('div', null, cfg.persone.map(p => h('div', { class: 'row' },
        h('div', { class: 'row-main' }, h('div', { class: 'row-title' }, p.etichetta || 'Senza etichetta', p.id === STATE.person?.id ? h('span', { class: 'chip gold', style: 'margin-left:8px' }, 'tu') : null),
          h('div', null, p.gruppi.map(g => h('span', { class: 'chip' }, gname(g))))),
        h('button', { class: 'btn quiet small', type: 'button', onclick: () => editPersona(p) }, 'Modifica'))))];
  }
  return h('section', { class: 'section', id: 'gestione' },
    h('div', { class: 'section-head' }, h('h2', null, 'Gestione del portale')),
    STATE.draft ? h('div', { class: 'changes' },
      h('p', null, h('b', null, 'Hai modifiche non ancora pubblicate.'), ' Le vedi solo tu, su questo dispositivo. Per renderle valide per tutti scarica il nuovo file config.json e caricalo nel repository GitHub purarchitettura.github.io (Add file → Upload files).'),
      h('div', { class: 'admin-bar' },
        h('button', { class: 'btn solid small', type: 'button', onclick: exportConfig }, 'Scarica config.json'),
        h('button', { class: 'btn quiet small', type: 'button', onclick: copyConfig }, 'Copia testo'),
        h('button', { class: 'btn danger small', type: 'button', onclick: () => { STATE.draft = null; LS.del('draft'); Home(); toast('Modifiche annullate'); } }, 'Annulla modifiche'))) : null,
    h('div', { class: 'panel' },
      h('div', { class: 'tabs', role: 'tablist' }, [['schede', 'Schede'], ['gruppi', 'Gruppi'], ['persone', 'Persone']].map(([k, l]) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(tab === k), onclick: () => setTab(k) }, l))),
      h('div', { class: 'panel-body' }, body)));
}
function modal(title, content, actions) {
  return new Promise(res => {
    const back = h('div', { class: 'modal-back', onclick: e => { if (e.target === back) close(null); } });
    const close = v => { back.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    back.append(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, h('h2', null, title), content,
      h('div', { class: 'modal-acts' }, actions.map(a => h('button', { class: 'btn small ' + (a.kind || 'quiet'), type: 'button', onclick: async () => { const r = a.run ? await a.run() : a.value; if (r !== false) close(r ?? a.value); } }, a.label)))));
    document.body.append(back); document.addEventListener('keydown', onKey);
    setTimeout(() => back.querySelector('input,textarea,select')?.focus(), 30);
  });
}
const field = (label, input, hint) => h('label', { class: 'field' }, h('span', null, label), input, hint ? h('small', null, hint) : null);
function groupChecks(cfg, selected, withAll) {
  const boxes = []; const wrap = h('div', { class: 'checks' });
  const add = (id, nome) => { const c = h('input', { type: 'checkbox', value: id, checked: selected.includes(id) }); boxes.push(c); wrap.append(h('label', null, c, nome)); };
  if (withAll) add('*', 'Tutti gli abilitati');
  cfg.gruppi.forEach(g => add(g.id, g.nome));
  return { el: wrap, value: () => boxes.filter(b => b.checked).map(b => b.value) };
}
async function editScheda(s) {
  const cfg = STATE.draft || STATE.cfg;
  const f = {
    nome: h('input', { value: s?.nome || '', maxlength: 60 }),
    descr: h('textarea', { rows: 3, maxlength: 240 }),
    url: h('input', { type: 'url', value: s?.url || 'https://', inputmode: 'url' }),
    guida: h('input', { type: 'url', value: s?.guida || '', placeholder: 'facoltativo', inputmode: 'url' }),
    tipo: h('select', null, h('option', { value: 'app' }, 'App dello studio'), h('option', { value: 'link' }, 'Collegamento esterno')),
    sezione: h('input', { value: s?.sezione || cfg.sezioni[0] || 'App dello studio', list: 'sez-list' }),
  };
  f.descr.value = s?.descrizione || ''; f.tipo.value = s?.tipo || 'app';
  const gc = groupChecks(cfg, s?.gruppi || ['*'], true);
  const dl = h('datalist', { id: 'sez-list' }, cfg.sezioni.map(x => h('option', { value: x })));
  const err = h('div', { class: 'err', hidden: true });
  const acts = [{ label: 'Annulla', value: null }];
  if (s) acts.unshift({ label: 'Elimina', kind: 'danger', run: () => { const d = draft(); d.schede = d.schede.filter(x => x.id !== s.id); d.sezioni = d.sezioni.filter(x => d.schede.some(sc => sc.sezione === x)); saveDraft(); toast('Scheda eliminata (da pubblicare)'); } });
  acts.push({ label: 'Salva', kind: 'solid', run: () => {
    const nome = f.nome.value.trim(), url = f.url.value.trim(), guida = f.guida.value.trim(), gruppi = gc.value();
    const bad = m => { err.textContent = m; err.hidden = false; return false; };
    if (!nome) return bad('Indica il nome della scheda.');
    if (!/^https:\/\/[^\s]+\.[^\s]+/.test(url)) return bad('Il link deve iniziare con https:// ed essere un indirizzo completo.');
    if (guida && !/^https:\/\/[^\s]+\.[^\s]+/.test(guida)) return bad('Il link della guida deve iniziare con https://.');
    if (!gruppi.length) return bad('Scegli almeno un gruppo che può vedere la scheda.');
    const d = draft(); const sez = f.sezione.value.trim() || 'Altro';
    if (!d.sezioni.includes(sez)) d.sezioni.push(sez);
    const data = { id: s?.id || (norm(nome).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'scheda') + '-' + Date.now().toString(36).slice(-4), nome, descrizione: f.descr.value.trim(), url, guida: guida || undefined, tipo: f.tipo.value, sezione: sez, gruppi };
    const i = d.schede.findIndex(x => x.id === data.id); if (i >= 0) d.schede[i] = data; else d.schede.push(data);
    d.sezioni = d.sezioni.filter(x => d.schede.some(sc => sc.sezione === x));
    saveDraft(); toast('Scheda salvata (da pubblicare)');
  } });
  await modal(s ? 'Modifica scheda' : 'Nuova scheda', h('div', { class: 'form' }, field('Nome', f.nome), field('Descrizione', f.descr, 'Una riga su a cosa serve'), field('Link', f.url), field('Guida', f.guida),
    field('Tipo', f.tipo), field('Sezione', f.sezione, 'Scegli una sezione esistente o scrivine una nuova'), dl, field('Chi la vede', gc.el), err), acts);
}
async function editGruppo(g) {
  const nome = h('input', { value: g?.nome || '', maxlength: 40 }), descr = h('input', { value: g?.descrizione || '', maxlength: 120 });
  const err = h('div', { class: 'err', hidden: true });
  const acts = [{ label: 'Annulla', value: null }];
  if (g && g.id !== CONFIG.ADMIN_GROUP) acts.unshift({ label: 'Elimina', kind: 'danger', run: () => {
    const d = draft(); d.gruppi = d.gruppi.filter(x => x.id !== g.id);
    d.persone.forEach(p => p.gruppi = p.gruppi.filter(x => x !== g.id)); d.schede.forEach(s => s.gruppi = (s.gruppi || []).filter(x => x !== g.id));
    saveDraft(); toast('Gruppo eliminato (da pubblicare)');
  } });
  acts.push({ label: 'Salva', kind: 'solid', run: () => {
    const n = nome.value.trim(); if (!n) { err.textContent = 'Indica il nome del gruppo.'; err.hidden = false; return false; }
    const d = draft();
    if (g) { const x = d.gruppi.find(y => y.id === g.id); x.nome = n; x.descrizione = descr.value.trim(); }
    else { let id = norm(n).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'gruppo'; while (d.gruppi.some(y => y.id === id)) id += '-2'; d.gruppi.push({ id, nome: n, descrizione: descr.value.trim() }); }
    saveDraft(); toast('Gruppo salvato (da pubblicare)');
  } });
  await modal(g ? 'Modifica gruppo' : 'Nuovo gruppo', h('div', { class: 'form' }, field('Nome', nome), field('Descrizione', descr, 'Facoltativa'),
    g?.id === CONFIG.ADMIN_GROUP ? h('p', { class: 'note', style: 'margin:0' }, 'Questo gruppo dà accesso alla gestione del portale e non si può eliminare.') : null, err), acts);
}
async function editPersona(p) {
  const cfg = STATE.draft || STATE.cfg;
  const email = h('input', { type: 'email', placeholder: 'nome@esempio.it', autocomplete: 'off', inputmode: 'email' });
  const lab = h('input', { value: p?.etichetta || '', maxlength: 60, placeholder: 'Es. Mario Rossi' });
  const gc = groupChecks(cfg, p?.gruppi || [], false);
  const err = h('div', { class: 'err', hidden: true });
  const adminsLeft = d => d.persone.filter(x => x.gruppi.includes(CONFIG.ADMIN_GROUP)).length;
  const acts = [{ label: 'Annulla', value: null }];
  if (p) acts.unshift({ label: 'Rimuovi', kind: 'danger', run: () => {
    const d = draft(); const rest = d.persone.filter(x => x.id !== p.id);
    if (p.gruppi.includes(CONFIG.ADMIN_GROUP) && rest.filter(x => x.gruppi.includes(CONFIG.ADMIN_GROUP)).length === 0) { err.textContent = 'Deve restare almeno una persona nel gruppo Amministrazione.'; err.hidden = false; return false; }
    d.persone = rest; saveDraft(); toast('Persona rimossa (da pubblicare)');
  } });
  acts.push({ label: 'Salva', kind: 'solid', run: async () => {
    const d = draft(); const gruppi = gc.value(); const bad = m => { err.textContent = m; err.hidden = false; return false; };
    if (!p) {
      const e = email.value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return bad('Inserisci un indirizzo email valido.');
      const id = await idFor(d.sale, e);
      if (d.persone.some(x => x.id === id)) return bad('Questa persona è già presente.');
      if (!gruppi.length) return bad('Scegli almeno un gruppo.');
      d.persone.push({ id, etichetta: lab.value.trim() || e.split('@')[0], gruppi });
    } else {
      const x = d.persone.find(y => y.id === p.id); const prev = x.gruppi; x.gruppi = gruppi; x.etichetta = lab.value.trim() || x.etichetta;
      if (adminsLeft(d) === 0) { x.gruppi = prev; return bad('Deve restare almeno una persona nel gruppo Amministrazione.'); }
      if (!gruppi.length) { x.gruppi = prev; return bad('Scegli almeno un gruppo, oppure usa «Rimuovi».'); }
    }
    saveDraft(); toast('Persona salvata (da pubblicare)');
  } });
  await modal(p ? 'Modifica persona' : 'Aggiungi persona', h('div', { class: 'form' },
    p ? null : field('Email dell\'account Google', email, 'Quella con cui la persona accederà. Non viene salvata.'),
    field('Etichetta', lab, 'Come la riconosci nell\'elenco (nome e cognome o ruolo)'), field('Gruppi', gc.el), err), acts);
}
function configText() { const d = STATE.draft; d.aggiornato = new Date().toISOString().slice(0, 10); return JSON.stringify(d, null, 2) + '\n'; }
function exportConfig() {
  const blob = new Blob([configText()], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'config.json' }); document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  toast('config.json scaricato: caricalo su GitHub per pubblicarlo');
}
async function copyConfig() { try { await navigator.clipboard.writeText(configText()); toast('Testo di config.json copiato'); } catch { toast('Copia non riuscita: usa «Scarica config.json»'); } }

/* ---------- avvio ---------- */
async function render() {
  const me = Auth.session();
  if (!me) return Gate();
  STATE.me = me;
  try { STATE.cfg = await loadConfig(); }
  catch (e) { page(h('div', { class: 'err' }, 'Impossibile caricare l\'elenco degli strumenti: ' + e.message)); return; }
  const id = await idFor(STATE.cfg.sale, me.email);
  STATE.person = STATE.cfg.persone.find(p => p.id === id) || null;
  if (!STATE.person) return NotEnabled();
  STATE.admin = STATE.person.gruppi.includes(CONFIG.ADMIN_GROUP);
  STATE.cfgSig = await sha256(JSON.stringify(STATE.cfg));
  const d = STATE.admin ? LS.get('draft') : null;
  // la bozza vale solo se il config pubblicato non è cambiato nel frattempo
  STATE.draft = d && d.base === STATE.cfgSig ? d.data : null;
  if (d && !STATE.draft) LS.del('draft');
  Home();
}
(async () => {
  const red = await Auth.readRedirect();
  if (red?.error) return Gate(red.error);
  render().catch(e => page(h('div', { class: 'err' }, 'Errore: ' + e.message)));
})();
</script>
</body>
